<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0f172a" />
    <title>Page not found | Krunalkumar Shah</title>
    <link rel="stylesheet" href="assets/css/main.css" />
    <style>
      .notfound-hero {
        display: flex;
        align-items: center;
        gap: 2.5rem;
        flex-wrap: wrap;
      }

      .notfound-copy {
        flex: 1 1 320px;
      }

      .notfound-art {
        flex: 0 1 300px;
        margin: 0 auto;
      }

      .notfound-art svg {
        display: block;
        width: 100%;
        height: auto;
      }

      .nf-rocket {
        animation: nf-fly 16s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: center;
      }

      @keyframes nf-fly {
        0% {
          transform: translate(0, 0) rotate(-4deg);
        }
        18% {
          transform: translate(-45px, 42px) rotate(-14deg);
        }
        38% {
          transform: translate(-70px, -8px) rotate(6deg);
        }
        55% {
          transform: translate(-20px, -34px) rotate(14deg);
        }
        72% {
          transform: translate(28px, 6px) rotate(2deg);
        }
        88% {
          transform: translate(12px, 44px) rotate(-8deg);
        }
        100% {
          transform: translate(0, 0) rotate(-4deg);
        }
      }

      @keyframes nf-fly-2 {
        0% {
          transform: translate(0, 0) rotate(-4deg);
        }
        15% {
          transform: translate(30px, -20px) rotate(10deg);
        }
        33% {
          transform: translate(-15px, -30px) rotate(-6deg);
        }
        50% {
          transform: translate(-60px, 10px) rotate(-12deg);
        }
        68% {
          transform: translate(-30px, 52px) rotate(8deg);
        }
        84% {
          transform: translate(20px, 30px) rotate(12deg);
        }
        100% {
          transform: translate(0, 0) rotate(-4deg);
        }
      }

      @keyframes nf-fly-3 {
        0% {
          transform: translate(0, 0) rotate(-4deg);
        }
        20% {
          transform: translate(-55px, 50px) rotate(-16deg);
        }
        40% {
          transform: translate(-65px, -20px) rotate(4deg);
        }
        60% {
          transform: translate(10px, -32px) rotate(16deg);
        }
        78% {
          transform: translate(32px, 20px) rotate(4deg);
        }
        100% {
          transform: translate(0, 0) rotate(-4deg);
        }
      }

      .nf-flame {
        animation: nf-flicker 0.35s ease-in-out infinite alternate;
        transform-box: fill-box;
        transform-origin: 50% 0%;
      }

      @keyframes nf-flicker {
        from {
          transform: scaleY(0.75);
          opacity: 0.85;
        }
        to {
          transform: scaleY(1.15);
          opacity: 1;
        }
      }

      .nf-star {
        animation: nf-twinkle 2.6s ease-in-out infinite;
      }

      .nf-star:nth-of-type(2n) {
        animation-delay: 0.9s;
      }

      .nf-star:nth-of-type(3n) {
        animation-delay: 1.6s;
      }

      @keyframes nf-twinkle {
        0%,
        100% {
          opacity: 0.25;
        }
        50% {
          opacity: 1;
        }
      }
    </style>
    <link rel="icon" type="image/jpeg" href="assets/images/favicon.jpg" />
    <link rel="apple-touch-icon" href="assets/images/favicon.jpg" />
  </head>

  <body id="top">
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <canvas id="bg-canvas" aria-hidden="true"></canvas>
    <div id="header-placeholder"></div>

    <main id="main-content" class="page-shell">
      <section class="page-hero notfound-hero">
        <div class="notfound-copy">
          <p class="eyebrow">Error 404</p>
          <h1 id="nf-title">This page seems to have wandered off.</h1>
          <p class="hero-text">
            The page you are looking for does not exist or may have been moved. Head back to the homepage or explore
            the sections below.
          </p>
          <div class="hero-actions">
            <a class="btn btn-primary" href="index.html">Go to homepage</a>
            <a class="btn btn-secondary" href="projects.html">Browse projects</a>
          </div>
        </div>
        <div class="notfound-art" aria-hidden="true">
          <svg viewBox="0 0 340 320" xmlns="http://www.w3.org/2000/svg">
            <circle class="nf-star" cx="30" cy="40" r="2" fill="#e2f0ff" />
            <circle class="nf-star" cx="300" cy="28" r="2.5" fill="#7dd3fc" />
            <circle class="nf-star" cx="255" cy="240" r="2" fill="#e2f0ff" />
            <circle class="nf-star" cx="60" cy="120" r="1.6" fill="#a855f7" />
            <circle class="nf-star" cx="320" cy="150" r="1.8" fill="#e2f0ff" />
            <circle class="nf-star" cx="150" cy="24" r="1.6" fill="#7dd3fc" />
            <circle class="nf-star" cx="20" cy="250" r="2.2" fill="#7dd3fc" />
            <circle class="nf-star" cx="200" cy="300" r="1.8" fill="#a855f7" />

            <circle cx="100" cy="215" r="62" fill="#1e293b" stroke="rgba(125, 211, 252, 0.5)" stroke-width="2" />
            <circle cx="74" cy="192" r="9" fill="rgba(125, 211, 252, 0.18)" />
            <circle cx="126" cy="244" r="6" fill="rgba(125, 211, 252, 0.14)" />
            <text x="100" y="228" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="38" font-weight="800" fill="#7dd3fc">404</text>
            <ellipse cx="100" cy="215" rx="98" ry="26" fill="none" stroke="rgba(168, 85, 247, 0.55)" stroke-width="5" transform="rotate(-16 100 215)" />

            <g class="nf-rocket">
              <path class="nf-flame" d="M245 152 C237 168 239 184 245 194 C251 184 253 168 245 152 Z" fill="#fb923c" />
              <path d="M245 44 C266 66 270 98 263 128 L227 128 C220 98 224 66 245 44 Z" fill="#e2e8f0" stroke="rgba(125, 211, 252, 0.55)" stroke-width="2" />
              <path d="M245 44 C252 52 257 62 259 72 L231 72 C233 62 238 52 245 44 Z" fill="#38bdf8" />
              <circle cx="245" cy="96" r="11" fill="#0b1120" stroke="#7dd3fc" stroke-width="3" />
              <path d="M227 116 L205 146 L229 138 Z" fill="#38bdf8" />
              <path d="M263 116 L285 146 L261 138 Z" fill="#38bdf8" />
              <rect x="233" y="128" width="24" height="8" rx="3" fill="#94a3b8" />
            </g>
          </svg>
        </div>
      </section>
    </main>

    <div id="footer-placeholder"></div>

    <script src="assets/js/include-partials.js"></script>
    <script src="assets/js/particle-bg.js"></script>
    <script>
      // Every visit gets a random flight path for the lost rocket and a random headline.
      (function () {
        const rocket = document.querySelector('.nf-rocket');
        if (rocket) {
          const flights = [
            ['nf-fly', '16s'],
            ['nf-fly-2', '14s'],
            ['nf-fly-3', '18s'],
          ];
          const flight = flights[Math.floor(Math.random() * flights.length)];
          rocket.style.animationName = flight[0];
          rocket.style.animationDuration = flight[1];
        }

        const title = document.getElementById('nf-title');
        if (title) {
          const headlines = [
            'This page seems to have wandered off.',
            'Houston, we have a problem — this page does not exist.',
            'This page drifted out of orbit.',
            'You have reached the edge of the known universe.',
            'Page lost in space. The rocket is still searching.',
            'These coordinates point to empty space.',
            'This link burned up on re-entry.',
            'Signal lost. This page is off the star map.',
          ];
          title.textContent = headlines[Math.floor(Math.random() * headlines.length)];
        }
      })();
    </script>
  </body>
</html>
