<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redirecting to krunalkumar.dpdns.org</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://krunalkumar.dpdns.org/">
<script>
// GitHub Pages serves this file for every path under /Krunalkumar/ that does not
// match a real file, which makes it the catch-all redirector for the whole site.
// Path-preserving: /Krunalkumar/about -> https://krunalkumar.dpdns.org/about
(function () {
  var LIVE = 'https://krunalkumar.dpdns.org';
  var BASE = '/Krunalkumar';
  var path = location.pathname;
  if (path.indexOf(BASE) === 0) path = path.slice(BASE.length);
  if (path.charAt(0) !== '/') path = '/' + path;
  location.replace(LIVE + path + location.search + location.hash);
})();
</script>
<!-- No-JS fallback. Cannot preserve the path, so it targets the root; the 1s
     delay guarantees the script above wins whenever JS is available. -->
<meta http-equiv="refresh" content="1; url=https://krunalkumar.dpdns.org/">
<style>
  :root { color-scheme: dark }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #0b0f14; color: #c9d4e0; text-align: center; padding: 1.5rem;
    font: 16px/1.6 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  }
  a { color: #6ea8fe }
</style>
</head>
<body>
  <main>
    <p>This site has moved to <a href="https://krunalkumar.dpdns.org/">krunalkumar.dpdns.org</a>&hellip;</p>
    <p><small>Not redirected? Use the link above.</small></p>
  </main>
</body>
</html>
