<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Cover image: I open-sourced my AI SDR — auto-responders for SmartLead and Instantly">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1324"/>
      <stop offset="1" stop-color="#172437"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <!-- pipeline: inbox -> AI -> human check -> send -->
  <g stroke="#38bdf8" stroke-width="4" opacity="0.9">
    <line x1="800" y1="250" x2="856" y2="250"/>
    <line x1="936" y1="250" x2="992" y2="250"/>
    <line x1="1072" y1="250" x2="1108" y2="250"/>
  </g>
  <!-- inbox -->
  <rect x="720" y="210" width="80" height="80" rx="16" fill="none" stroke="#7dd3fc" stroke-width="4"/>
  <path d="M 738 240 L 760 258 L 782 240 M 738 236 L 782 236" stroke="#7dd3fc" stroke-width="4" fill="none"/>
  <!-- AI node -->
  <rect x="856" y="210" width="80" height="80" rx="16" fill="#7dd3fc" opacity="0.92"/>
  <circle cx="884" cy="243" r="5" fill="#131f2d"/>
  <circle cx="908" cy="243" r="5" fill="#131f2d"/>
  <path d="M 882 265 Q 896 276 910 265" stroke="#131f2d" stroke-width="4" fill="none"/>
  <!-- human approval -->
  <rect x="992" y="210" width="80" height="80" rx="16" fill="none" stroke="#7dd3fc" stroke-width="4"/>
  <path d="M 1012 252 L 1026 266 L 1052 236" stroke="#7dd3fc" stroke-width="5" fill="none"/>
  <!-- send arrow -->
  <path d="M 1108 250 L 1150 230 L 1128 250 L 1150 270 Z" fill="#7dd3fc"/>
  <text x="896" y="330" fill="#94a3b8" font-family="'Segoe UI',sans-serif" font-size="16" font-weight="700" text-anchor="middle">reply → AI draft → human approves → sent</text>
  <g font-family="'Segoe UI', Tahoma, sans-serif">
    <text x="80" y="185" fill="#7dd3fc" font-size="26" font-weight="800" letter-spacing="8">AUTOMATION</text>
    <text x="80" y="262" fill="#f8fafc" font-size="56" font-weight="800">I open-sourced</text>
    <text x="80" y="328" fill="#f8fafc" font-size="56" font-weight="800">my AI SDR</text>
    <text x="80" y="396" fill="#e2e8f0" font-size="29" font-weight="600">Auto-responders for SmartLead &amp; Instantly,</text>
    <text x="80" y="437" fill="#e2e8f0" font-size="29" font-weight="600">with a human approval gate in Slack.</text>
    <text x="80" y="540" fill="#94a3b8" font-size="24" font-weight="700">krunalkumar.dpdns.org · Blog</text>
  </g>
</svg>
