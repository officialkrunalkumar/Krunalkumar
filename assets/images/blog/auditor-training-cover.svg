<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Cover image: What an auditor actually wants from security training — a checklist of four evidence records beside chips labeled ISO 27001, SOC 2, and DPDP Act">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121b2c"/>
      <stop offset="1" stop-color="#1f2c3f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.38" r="0.55">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <g fill="#e2e8f0" opacity="0.35">
    <circle cx="150" cy="76" r="2"/><circle cx="430" cy="58" r="1.5"/><circle cx="672" cy="96" r="2"/>
    <circle cx="104" cy="452" r="1.5"/><circle cx="336" cy="556" r="2"/><circle cx="1128" cy="74" r="1.5"/>
    <circle cx="1058" cy="596" r="2"/><circle cx="628" cy="588" r="1.5"/>
  </g>

  <g font-family="'Segoe UI', Tahoma, sans-serif">
    <text x="80" y="168" fill="#7dd3fc" font-size="26" font-weight="800" letter-spacing="8">BUSINESS</text>
    <text x="80" y="250" fill="#f8fafc" font-size="52" font-weight="800">What an auditor</text>
    <text x="80" y="315" fill="#f8fafc" font-size="52" font-weight="800">actually wants from</text>
    <text x="80" y="380" fill="#f8fafc" font-size="52" font-weight="800">security training</text>
    <text x="80" y="450" fill="#e2e8f0" font-size="26" font-weight="600">The evidence pack, not the certificate</text>
    <text x="80" y="556" fill="#94a3b8" font-size="24" font-weight="700">krunalkumar.dpdns.org · Blog</text>
  </g>

  <!-- The evidence file: four records, then the frameworks they get read against -->
  <rect x="768" y="112" width="356" height="300" rx="16" fill="rgba(125,211,252,0.10)" stroke="#7dd3fc" stroke-width="3"/>
  <g stroke="#4ade80" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <polyline points="802,166 818,183 848,150"/>
    <polyline points="802,236 818,253 848,220"/>
    <polyline points="802,306 818,323 848,290"/>
    <polyline points="802,376 818,393 848,360"/>
  </g>
  <g fill="#38bdf8" opacity="0.85">
    <rect x="874" y="158" width="212" height="13" rx="6"/>
    <rect x="874" y="228" width="168" height="13" rx="6"/>
    <rect x="874" y="298" width="196" height="13" rx="6"/>
    <rect x="874" y="368" width="140" height="13" rx="6"/>
  </g>
  <g font-family="'Segoe UI',sans-serif" text-anchor="middle">
    <rect x="768" y="452" width="180" height="46" rx="10" fill="#7dd3fc"/>
    <text x="858" y="482" fill="#131f2d" font-size="21" font-weight="800">ISO 27001</text>
    <rect x="968" y="452" width="156" height="46" rx="10" fill="#4ade80"/>
    <text x="1046" y="482" fill="#131f2d" font-size="21" font-weight="800">SOC 2</text>
    <rect x="768" y="514" width="356" height="46" rx="10" fill="#fbbf24"/>
    <text x="946" y="544" fill="#131f2d" font-size="21" font-weight="800">DPDP ACT 2023</text>
  </g>
</svg>
