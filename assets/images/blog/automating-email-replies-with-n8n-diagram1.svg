<svg width="760" height="210" viewBox="0 0 760 210" role="img" aria-labelledby="d-automating-email-replies-with-n8n-diagram1" xmlns="http://www.w3.org/2000/svg">
  <title id="d-automating-email-replies-with-n8n-diagram1">Five-stage email automation: Trigger, Fetch and parse, Classify, Draft, Act</title>
  <rect width="760" height="210" rx="18" fill="#1b2735"/>
  <text x="30" y="40" fill="#7dd3fc" font-family="'Segoe UI',sans-serif" font-size="15" font-weight="800" letter-spacing="2">REPLY AUTOMATION FLOW</text>
  <g font-family="'Segoe UI',sans-serif" text-anchor="middle" font-size="12" font-weight="700">
    <rect x="30" y="90" width="120" height="60" rx="12" fill="none" stroke="#7dd3fc" stroke-width="2"/>
    <text x="90" y="125" fill="#e2e8f0">Trigger</text>
    <rect x="180" y="90" width="120" height="60" rx="12" fill="none" stroke="#7dd3fc" stroke-width="2"/>
    <text x="240" y="118" fill="#e2e8f0">Fetch &amp;</text>
    <text x="240" y="136" fill="#e2e8f0">parse</text>
    <rect x="330" y="90" width="120" height="60" rx="12" fill="#7dd3fc"/>
    <text x="390" y="125" fill="#131f2d">Classify</text>
    <rect x="480" y="90" width="120" height="60" rx="12" fill="none" stroke="#7dd3fc" stroke-width="2"/>
