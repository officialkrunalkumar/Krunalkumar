    <rect x="630" y="90" width="100" height="60" rx="12" fill="none" stroke="#7dd3fc" stroke-width="2"/>
    <text x="680" y="125" fill="#e2e8f0">Act</text>
    <g stroke="#475569" stroke-width="3">
