<svg width="760" height="210" viewBox="0 0 760 210" role="img" aria-labelledby="d-automating-email-replies-with-n8n-diagram1" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <title id="d-automating-email-replies-with-n8n-diagram1">Five-stage email automation: Trigger, Fetch and parse, Classify, Draft, Act</title>
  <text x="30" y="40" fill="#1e77a4" font-size="15" font-weight="800" letter-spacing="2">REPLY AUTOMATION FLOW</text>
  <g text-anchor="middle" font-size="12" font-weight="700">
    <rect x="30" y="90" width="120" height="60" rx="12" fill="none" stroke="#1e77a4" stroke-width="2"/>
    <text x="90" y="125" fill="#6b7a90">Trigger</text>
    <rect x="180" y="90" width="120" height="60" rx="12" fill="none" stroke="#1e77a4" stroke-width="2"/>
    <text x="240" y="118" fill="#6b7a90">Fetch &amp;</text>
    <text x="240" y="136" fill="#6b7a90">parse</text>
    <rect x="330" y="90" width="120" height="60" rx="12" fill="#1e77a4"/>
    <text x="390" y="125" fill="#ffffff">Classify</text>
    <rect x="480" y="90" width="120" height="60" rx="12" fill="none" stroke="#1e77a4" stroke-width="2"/>
    <text x="540" y="125" fill="#6b7a90">Draft</text>
    <rect x="630" y="90" width="100" height="60" rx="12" fill="none" stroke="#1e77a4" stroke-width="2"/>
    <text x="680" y="125" fill="#6b7a90">Act</text>
    <g stroke="#6b7a90" stroke-width="3">
      <path d="M 152 120 L 178 120"/><path d="M 302 120 L 328 120"/>
