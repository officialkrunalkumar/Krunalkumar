<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Cover image: Why your automation broke — a run history strip where seven runs succeeded and the next five never happened, beside a silenced alarm reading zero errors and zero alerts">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121b2c"/>
      <stop offset="1" stop-color="#1f2c3f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.79" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <g fill="#e2e8f0" opacity="0.32">
    <circle cx="152" cy="80" r="2"/><circle cx="428" cy="60" r="1.5"/><circle cx="668" cy="92" r="2"/>
    <circle cx="98" cy="450" r="1.5"/><circle cx="356" cy="566" r="2"/><circle cx="1132" cy="88" r="1.5"/>
    <circle cx="1046" cy="594" r="2"/><circle cx="652" cy="586" r="1.5"/>
  </g>

  <!-- Run history panel: seven runs, then an absence nobody was told about -->
  <rect x="700" y="132" width="440" height="368" rx="18" fill="rgba(125,211,252,0.06)" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.4"/>
  <text x="732" y="182" fill="#7dd3fc" font-family="'Segoe UI',sans-serif" font-size="19" font-weight="800" letter-spacing="4">RUN HISTORY</text>

  <g fill="#4ade80">
    <circle cx="746" cy="234" r="13"/><circle cx="780" cy="234" r="13"/><circle cx="814" cy="234" r="13"/>
    <circle cx="848" cy="234" r="13"/><circle cx="882" cy="234" r="13"/><circle cx="916" cy="234" r="13"/>
    <circle cx="950" cy="234" r="13"/>
  </g>
  <g fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="4 5" opacity="0.75">
    <circle cx="984" cy="234" r="13"/><circle cx="1018" cy="234" r="13"/><circle cx="1052" cy="234" r="13"/>
    <circle cx="1086" cy="234" r="13"/><circle cx="1120" cy="234" r="13"/>
  </g>

  <g font-family="'Segoe UI',sans-serif">
    <text x="732" y="292" fill="#f8fafc" font-size="21" font-weight="800">It ran hourly. Then it stopped.</text>
    <text x="732" y="322" fill="#94a3b8" font-size="19" font-weight="600">Nothing failed, because nothing ran.</text>
  </g>

  <rect x="732" y="352" width="376" height="112" rx="14" fill="rgba(248,113,113,0.10)" stroke="#f87171" stroke-width="2.5" stroke-dasharray="10 7"/>
  <g fill="none" stroke="#f87171" stroke-width="3" stroke-linecap="round">
    <path d="M780 380 a18 18 0 0 1 18 18 v14 l6 8 h-48 l6-8 v-14 a18 18 0 0 1 18-18 z"/>
    <path d="M772 426 a8 8 0 0 0 16 0"/>
    <path d="M756 432 L804 372" stroke-width="3.5"/>
  </g>
  <g font-family="'Segoe UI',sans-serif" fill="#f87171" font-weight="800" font-size="21">
    <text x="836" y="398">0 errors</text>
    <text x="836" y="432">0 alerts</text>
  </g>

  <g font-family="'Segoe UI', Tahoma, sans-serif">
    <text x="80" y="190" fill="#7dd3fc" font-size="26" font-weight="800" letter-spacing="8">AUTOMATION</text>
    <text x="80" y="268" fill="#f8fafc" font-size="52" font-weight="800">Why your automation</text>
    <text x="80" y="332" fill="#f8fafc" font-size="52" font-weight="800">broke</text>
    <text x="80" y="406" fill="#e2e8f0" font-size="27" font-weight="600">Eight causes, and the guard that</text>
    <text x="80" y="446" fill="#e2e8f0" font-size="27" font-weight="600">catches each one before a customer does.</text>
    <text x="80" y="548" fill="#94a3b8" font-size="24" font-weight="700">krunalkumar.dpdns.org · Blog</text>
  </g>
</svg>
