<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Cover image: My career story — from GTU classrooms to research, AI pipelines, and mentorship">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.7" r="0.6">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <!-- winding path with milestone dots -->
  <path d="M 830 520 C 950 470 890 380 990 340 C 1090 300 1030 220 1120 170"
        fill="none" stroke="#38bdf8" stroke-width="4" stroke-dasharray="2 10" stroke-linecap="round" opacity="0.9"/>
  <circle cx="830" cy="520" r="16" fill="#7dd3fc"/>
  <circle cx="990" cy="340" r="16" fill="#7dd3fc"/>
  <circle cx="1120" cy="170" r="16" fill="#7dd3fc"/>
  <g font-family="'Segoe UI', Tahoma, sans-serif">
    <text x="80" y="200" fill="#7dd3fc" font-size="26" font-weight="800" letter-spacing="8">CAREER STORY</text>
    <text x="80" y="280" fill="#f8fafc" font-size="58" font-weight="800">From GTU classrooms to</text>
    <text x="80" y="350" fill="#f8fafc" font-size="58" font-weight="800">research &amp; AI pipelines</text>
    <text x="80" y="420" fill="#e2e8f0" font-size="30" font-weight="600">The honest version, setbacks included.</text>
    <text x="80" y="540" fill="#94a3b8" font-size="24" font-weight="700">krunalkumar.dpdns.org · Blog</text>
  </g>
</svg>
