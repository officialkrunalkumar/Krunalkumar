<svg width="760" height="300" viewBox="0 0 760 300" role="img" aria-labelledby="d-character-over-career-the-choices-i-live-by-diagram1" xmlns="http://www.w3.org/2000/svg">
  <title id="d-character-over-career-the-choices-i-live-by-diagram1">Five paired choices: Character over Career, Satisfaction over Success, Failure over Fear, People over Place, Goal over Gossip</title>
                  <rect width="760" height="300" rx="18" fill="#1b2735"/>
                  <g font-family="'Segoe UI',sans-serif" font-size="20" font-weight="700">
                    <text x="40" y="62" fill="#7dd3fc">Character</text>
                    <text x="250" y="62" fill="#64748b" font-size="15" font-weight="600">over</text>
                    <text x="320" y="62" fill="#475569">Career</text>
                    <text x="40" y="112" fill="#7dd3fc">Satisfaction</text>
                    <text x="250" y="112" fill="#64748b" font-size="15" font-weight="600">over</text>
                    <text x="320" y="112" fill="#475569">Success</text>
                    <text x="40" y="162" fill="#7dd3fc">Failure</text>
                    <text x="250" y="162" fill="#64748b" font-size="15" font-weight="600">over</text>
                    <text x="320" y="162" fill="#475569">Fear</text>
                    <text x="40" y="212" fill="#7dd3fc">People</text>
                    <text x="250" y="212" fill="#64748b" font-size="15" font-weight="600">over</text>
                    <text x="320" y="212" fill="#475569">Place</text>
                    <text x="40" y="262" fill="#7dd3fc">Goal</text>
                    <text x="250" y="262" fill="#64748b" font-size="15" font-weight="600">over</text>
                    <text x="320" y="262" fill="#475569">Gossip</text>
                  </g>
                  <text x="560" y="150" fill="#94a3b8" font-family="'Segoe UI',sans-serif" font-size="14" font-weight="700" text-anchor="middle">same letter,</text>
                  <text x="560" y="172" fill="#94a3b8" font-family="'Segoe UI',sans-serif" font-size="14" font-weight="700" text-anchor="middle">different choice</text>
                </svg>
