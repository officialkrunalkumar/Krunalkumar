<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Cover image: a typed figure frozen and struck out, and below it the same figure counted at deploy time">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121b2c"/>
      <stop offset="1" stop-color="#1f2c3f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <g fill="none" stroke="#38bdf8" stroke-width="3">
    <rect x="720" y="150" width="360" height="330" rx="14" stroke-opacity="0.35"/>
  </g>
  <rect x="756" y="186" width="288" height="112" rx="10" fill="none" stroke="#f87171" stroke-width="4" stroke-dasharray="14 10" opacity="0.85"/>
  <text x="800" y="262" font-family="'Segoe UI',sans-serif" font-size="54" font-weight="800" fill="#f87171" opacity="0.85">143</text>
  <path d="M792 244 L892 244" stroke="#f87171" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
  <text x="920" y="252" font-family="'Segoe UI',sans-serif" font-size="20" font-weight="800" fill="#94a3b8" letter-spacing="3">TYPED</text>
  <g stroke="#7dd3fc" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M900 310 L900 350"/>
    <path d="M886 336 L900 352 L914 336"/>
  </g>
  <rect x="756" y="364" width="288" height="112" rx="10" fill="none" stroke="#7dd3fc" stroke-width="5"/>
  <text x="800" y="440" font-family="'Segoe UI',sans-serif" font-size="54" font-weight="800" fill="#7dd3fc">165</text>
  <text x="920" y="430" font-family="'Segoe UI',sans-serif" font-size="20" font-weight="800" fill="#e2e8f0" letter-spacing="3">COUNTED</text>
  <g font-family="'Segoe UI', Tahoma, sans-serif">
    <text x="80" y="200" fill="#7dd3fc" font-size="26" font-weight="800" letter-spacing="8">ENGINEERING</text>
    <text x="80" y="280" fill="#f8fafc" font-size="52" font-weight="800">Every number here</text>
    <text x="80" y="345" fill="#f8fafc" font-size="52" font-weight="800">is counted, not typed</text>
    <text x="80" y="422" fill="#e2e8f0" font-size="26" font-weight="600">A typed number has no owner</text>
    <text x="80" y="545" fill="#94a3b8" font-size="24" font-weight="700">krunalkumar.dpdns.org &#183; Blog</text>
  </g>
