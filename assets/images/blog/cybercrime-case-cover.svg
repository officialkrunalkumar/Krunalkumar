<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Cover image: How cybercrime cases are solved — a magnifying glass examining a fingerprint whose ridges merge into circuit traces">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121b2c"/>
      <stop offset="1" stop-color="#1f2c3f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.4" r="0.5">
      <stop offset="0" stop-color="rgba(88,52,166,0.35)"/>
      <stop offset="1" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <g fill="#e2e8f0" opacity="0.35">
    <circle cx="140" cy="90" r="2"/><circle cx="420" cy="60" r="1.5"/><circle cx="700" cy="110" r="2"/>
    <circle cx="90" cy="420" r="1.5"/><circle cx="320" cy="540" r="2"/><circle cx="1130" cy="70" r="1.5"/>
    <circle cx="1060" cy="560" r="2"/><circle cx="620" cy="580" r="1.5"/>
  </g>

  <text x="80" y="150" fill="#7dd3fc" font-family="'Segoe UI',sans-serif" font-size="26" font-weight="800" letter-spacing="8">SECURITY</text>
  <text x="80" y="240" fill="#f8fafc" font-family="'Segoe UI',sans-serif" font-size="62" font-weight="800">How cybercrime cases</text>
  <text x="80" y="312" fill="#f8fafc" font-family="'Segoe UI',sans-serif" font-size="62" font-weight="800">are solved</text>
  <text x="80" y="390" fill="#cbd5e1" font-family="'Segoe UI',sans-serif" font-size="30">Incident response, investigation, and</text>
  <text x="80" y="432" fill="#cbd5e1" font-family="'Segoe UI',sans-serif" font-size="30">forensics — from first alert to trial.</text>
  <text x="80" y="560" fill="#8fa0b8" font-family="'Segoe UI',sans-serif" font-size="26" font-weight="700">krunalkumar.dpdns.org · Blog</text>

  <!-- Circuit traces radiating from the evidence -->
  <g stroke="#38bdf8" stroke-width="2.5" fill="none" opacity="0.55">
    <polyline points="1010,170 1080,170 1080,110"/>
    <polyline points="1035,240 1120,240 1120,300"/>
    <polyline points="880,150 880,90 950,90"/>
    <polyline points="845,300 790,300 790,370"/>
  </g>
  <g opacity="0.9">
    <circle cx="1080" cy="110" r="6" fill="#4ade80"/>
    <circle cx="1120" cy="300" r="6" fill="#a855f7"/>
    <circle cx="950" cy="90" r="6" fill="#fbbf24"/>
    <circle cx="790" cy="370" r="6" fill="#4ade80"/>
  </g>

  <!-- Fingerprint ridges under the lens -->
  <g stroke="#7dd3fc" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M925 258 a18 18 0 1 1 26 18"/>
    <path d="M905 265 a36 36 0 1 1 58 30"/>
    <path d="M888 274 a54 54 0 1 1 82 44"/>
    <path d="M873 285 a72 72 0 1 1 100 58"/>
  </g>

  <!-- Magnifying glass -->
  <circle cx="938" cy="268" r="112" fill="rgba(125,211,252,0.08)" stroke="#e2e8f0" stroke-width="9"/>
  <circle cx="938" cy="268" r="126" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.4"/>
  <line x1="1020" y1="348" x2="1096" y2="430" stroke="#cbd5e1" stroke-width="18" stroke-linecap="round"/>
</svg>
