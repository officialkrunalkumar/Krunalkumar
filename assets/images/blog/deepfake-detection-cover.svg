<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Cover image: What deepfake detection can and cannot do. A file signed at capture, the same file after a platform upload with its signature and metadata stripped, and a magnifier over the result showing a question mark">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121b2c"/>
      <stop offset="1" stop-color="#1f2c3f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.44" r="0.6">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Deliberately not a face with a red box on it. The subject is what
       happens to the evidence between the camera and you. -->

  <!-- 1. Signed at capture -->
  <g transform="translate(800,108)">
    <rect x="0" y="0" width="118" height="78" rx="8" fill="none" stroke="#7dd3fc" stroke-width="3"/>
    <path d="M10 62 L40 34 L60 52 L82 32 L108 62" fill="none" stroke="#7dd3fc" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="32" cy="22" r="7" fill="#7dd3fc"/>
    <circle cx="150" cy="39" r="20" fill="#4ade80"/>
    <path d="M141 39 l7 8 l13 -16" fill="none" stroke="#131f2d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="0" y="112" fill="#94a3b8" font-family="'Segoe UI', Tahoma, sans-serif" font-size="20" font-weight="700">signed at capture</text>
  </g>

  <!-- 2. Through a platform, which strips it -->
  <g transform="translate(800,268)">
    <g stroke="#94a3b8" stroke-width="3" stroke-linecap="round">
      <line x1="59" y1="0" x2="59" y2="22"/>
      <path d="M50 14 L59 24 L68 14" fill="none"/>
    </g>
    <path d="M28 66 a22 22 0 0 1 20 -30 a28 28 0 0 1 52 6 a20 20 0 0 1 -4 39 h-64 a18 18 0 0 1 -4 -15 z"
          fill="none" stroke="#94a3b8" stroke-width="3" stroke-linejoin="round"/>
    <text x="130" y="70" fill="#94a3b8" font-family="'Segoe UI', Tahoma, sans-serif" font-size="20" font-weight="700">re-encoded, stripped</text>
    <g stroke="#94a3b8" stroke-width="3" stroke-linecap="round">
      <line x1="59" y1="86" x2="59" y2="108"/>
      <path d="M50 98 L59 108 L68 98" fill="none"/>
    </g>
  </g>

  <!-- 3. What actually reaches you -->
  <g transform="translate(800,424)">
    <rect x="0" y="0" width="118" height="78" rx="8" fill="none" stroke="#a855f7" stroke-width="3"/>
    <path d="M10 62 L40 34 L60 52 L82 32 L108 62" fill="none" stroke="#a855f7" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="32" cy="22" r="7" fill="#a855f7"/>
    <circle cx="150" cy="39" r="20" fill="none" stroke="#a855f7" stroke-width="3"/>
    <text x="150" y="48" fill="#a855f7" font-family="'Segoe UI', Tahoma, sans-serif" font-size="26" font-weight="800" text-anchor="middle">?</text>
    <circle cx="222" cy="30" r="19" fill="none" stroke="#a855f7" stroke-width="4"/>
    <line x1="235" y1="44" x2="252" y2="61" stroke="#a855f7" stroke-width="5" stroke-linecap="round"/>
    <text x="0" y="112" fill="#94a3b8" font-family="'Segoe UI', Tahoma, sans-serif" font-size="20" font-weight="700">what reaches you</text>
  </g>

  <g font-family="'Segoe UI', Tahoma, sans-serif">
    <text x="80" y="178" fill="#7dd3fc" font-size="24" font-weight="800" letter-spacing="7">SECURITY</text>
    <text x="80" y="256" fill="#f8fafc" font-size="54" font-weight="800">What deepfake detection</text>
    <text x="80" y="322" fill="#f8fafc" font-size="54" font-weight="800">can and cannot do</text>
    <text x="80" y="392" fill="#e2e8f0" font-size="29" font-weight="600">Detection is losing the arms race.</text>
    <text x="80" y="433" fill="#e2e8f0" font-size="29" font-weight="600">Provenance and process are not.</text>
    <text x="80" y="540" fill="#94a3b8" font-size="24" font-weight="700">krunalkumar.dpdns.org &#183; Blog</text>
  </g>
</svg>
