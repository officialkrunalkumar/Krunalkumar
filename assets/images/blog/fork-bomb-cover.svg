<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Cover image: What is a fork bomb? Why one line of Bash can freeze a Linux system">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.4" r="0.65">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <!-- process tree doubling: 1 -> 2 -> 4 -->
  <g stroke="#38bdf8" stroke-width="3" opacity="0.85">
    <line x1="960" y1="140" x2="880" y2="260"/>
    <line x1="960" y1="140" x2="1040" y2="260"/>
    <line x1="880" y1="260" x2="830" y2="390"/>
    <line x1="880" y1="260" x2="930" y2="390"/>
    <line x1="1040" y1="260" x2="990" y2="390"/>
    <line x1="1040" y1="260" x2="1090" y2="390"/>
  </g>
  <circle cx="960" cy="140" r="26" fill="#7dd3fc"/>
  <circle cx="880" cy="260" r="20" fill="none" stroke="#7dd3fc" stroke-width="4"/>
  <circle cx="1040" cy="260" r="20" fill="none" stroke="#7dd3fc" stroke-width="4"/>
  <circle cx="830" cy="390" r="15" fill="none" stroke="#7dd3fc" stroke-width="3"/>
  <circle cx="930" cy="390" r="15" fill="none" stroke="#7dd3fc" stroke-width="3"/>
  <circle cx="990" cy="390" r="15" fill="none" stroke="#7dd3fc" stroke-width="3"/>
  <circle cx="1090" cy="390" r="15" fill="none" stroke="#7dd3fc" stroke-width="3"/>
  <g font-family="'Segoe UI', Tahoma, sans-serif">
    <text x="80" y="200" fill="#7dd3fc" font-size="26" font-weight="800" letter-spacing="8">LINUX SECURITY</text>
    <text x="80" y="280" fill="#f8fafc" font-size="58" font-weight="800">What is a fork bomb?</text>
    <text x="80" y="350" fill="#e2e8f0" font-size="32" font-weight="600">Why one line of Bash can freeze</text>
    <text x="80" y="395" fill="#e2e8f0" font-size="32" font-weight="600">a hardened Linux system.</text>
    <text x="80" y="540" fill="#94a3b8" font-size="24" font-weight="700">krunalkumar.dpdns.org · Blog</text>
  </g>
</svg>
