<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Cover image: The four Ms every business runs on — manpower, money, mind, and management">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <!-- four pillars supporting a beam -->
  <g>
    <rect x="700" y="180" width="420" height="26" rx="6" fill="#7dd3fc"/>
    <rect x="712" y="210" width="70" height="230" rx="8" fill="#38bdf8" opacity="0.6"/>
    <rect x="812" y="210" width="70" height="230" rx="8" fill="#38bdf8" opacity="0.72"/>
    <rect x="912" y="210" width="70" height="230" rx="8" fill="#38bdf8" opacity="0.84"/>
    <rect x="1012" y="210" width="70" height="230" rx="8" fill="#7dd3fc"/>
    <rect x="690" y="440" width="440" height="20" rx="6" fill="#334155"/>
    <g font-family="'Segoe UI',sans-serif" font-size="15" font-weight="800" fill="#0b1220" text-anchor="middle">
      <text x="747" y="335" transform="rotate(-90 747 335)">MANPOWER</text>
      <text x="847" y="335" transform="rotate(-90 847 335)">MONEY</text>
      <text x="947" y="335" transform="rotate(-90 947 335)">MIND</text>
      <text x="1047" y="345" transform="rotate(-90 1047 345)">MANAGEMENT</text>
    </g>
  </g>
  <g font-family="'Segoe UI', Tahoma, sans-serif">
    <text x="80" y="200" fill="#7dd3fc" font-size="26" font-weight="800" letter-spacing="8">BUSINESS</text>
    <text x="80" y="280" fill="#f8fafc" font-size="58" font-weight="800">The four M's every</text>
    <text x="80" y="345" fill="#f8fafc" font-size="58" font-weight="800">business runs on</text>
    <text x="80" y="415" fill="#e2e8f0" font-size="28" font-weight="600">Manpower · Money · Mind · Management</text>
    <text x="80" y="545" fill="#94a3b8" font-size="24" font-weight="700">krunalkumar.dpdns.org · Blog</text>
  </g>
</svg>
