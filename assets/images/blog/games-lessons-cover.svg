<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Four game states — ready, playing, paused, game over — with the broken transition from paused to a new game crossed out and the resume transition highlighted">
  <!-- Ground: the house diagonal, dark navy into slate -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121b2c" />
      <stop offset="1" stop-color="#1f2c3f" />
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.28" />
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#7dd3fc" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#4ade80" />
    </marker>
    <marker id="arrowGrey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#94a3b8" />
    </marker>
  </defs>
  <rect width="1200" height="630" fill="url(#ground)" />
  <ellipse cx="520" cy="240" rx="420" ry="260" fill="url(#glow)" />

  <!-- Pac-dots trail along the top, eaten from the left -->
  <g fill="#7dd3fc" opacity="0.55">
    <circle cx="560" cy="86" r="7" />
    <circle cx="620" cy="86" r="7" />
    <circle cx="680" cy="86" r="7" />
    <circle cx="740" cy="86" r="7" />
    <circle cx="800" cy="86" r="7" />
    <circle cx="860" cy="86" r="7" />
    <circle cx="920" cy="86" r="7" />
    <circle cx="980" cy="86" r="7" />
    <circle cx="1040" cy="86" r="7" />
  </g>
  <!-- The chomper, mid-bite -->
  <path d="M470 86 m38 0 a38 38 0 1 1 -11 -27 z" fill="#38bdf8" transform="rotate(8 508 86)" />
  <circle cx="500" cy="68" r="5" fill="#121b2c" />

  <!-- State nodes -->
  <g font-family="'Segoe UI', Tahoma, sans-serif" font-weight="700" font-size="26" text-anchor="middle">
    <!-- READY -->
    <rect x="60" y="230" width="220" height="86" rx="16" fill="#131f2d" stroke="#94a3b8" stroke-width="2.5" />
    <text x="170" y="283" fill="#94a3b8">READY</text>

    <!-- PLAYING -->
    <rect x="410" y="230" width="240" height="86" rx="16" fill="#131f2d" stroke="#38bdf8" stroke-width="3.5" />
    <text x="530" y="283" fill="#7dd3fc">PLAYING</text>

    <!-- PAUSED -->
    <rect x="790" y="230" width="230" height="86" rx="16" fill="#131f2d" stroke="#7dd3fc" stroke-width="2.5" />
    <text x="905" y="283" fill="#7dd3fc">PAUSED</text>

    <!-- GAME OVER -->
    <rect x="410" y="460" width="240" height="86" rx="16" fill="#131f2d" stroke="#94a3b8" stroke-width="2.5" />
    <text x="530" y="513" fill="#94a3b8">GAME OVER</text>

    <!-- The wrong destination: a fresh board dealt from a paused run -->
    <rect x="790" y="460" width="230" height="86" rx="16" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 7" opacity="0.75" />
    <text x="905" y="513" fill="#94a3b8" opacity="0.75">NEW GAME</text>
  </g>

  <!-- Transitions -->
  <g fill="none" stroke-width="3">
    <!-- ready -> playing -->
    <path d="M280 273 H400" stroke="#7dd3fc" marker-end="url(#arrow)" />
    <!-- playing -> paused (upper) -->
    <path d="M650 253 H780" stroke="#7dd3fc" marker-end="url(#arrow)" />
    <!-- paused -> playing (lower, the correct resume) -->
    <path d="M790 296 H660" stroke="#4ade80" stroke-width="4" marker-end="url(#arrowGreen)" />
    <!-- playing -> game over -->
    <path d="M530 316 V450" stroke="#7dd3fc" marker-end="url(#arrow)" />
    <!-- paused -> new game: the bug, crossed out -->
    <path d="M905 316 V450" stroke="#94a3b8" stroke-dasharray="9 8" marker-end="url(#arrowGrey)" opacity="0.8" />
  </g>

  <!-- Labels on the two transitions that matter -->
  <g font-family="'Segoe UI', Tahoma, sans-serif" font-size="19" font-weight="700">
    <text x="722" y="332" fill="#4ade80" text-anchor="middle">tap = resume</text>
    <text x="990" y="392" fill="#94a3b8" text-anchor="start" opacity="0.9">tap used to</text>
    <text x="990" y="416" fill="#94a3b8" text-anchor="start" opacity="0.9">mean this</text>
  </g>

  <!-- The cross over the wrong transition -->
  <g stroke="#f0a5a5" stroke-width="5" stroke-linecap="round">
    <path d="M885 366 L925 406" />
    <path d="M925 366 L885 406" />
  </g>

  <!-- Ghost keeping an eye on the whole machine -->
  <g transform="translate(96,470)">
    <path d="M0 60 V26 a30 30 0 0 1 60 0 v34 l-10 -9 -10 9 -10 -9 -10 9 -10 -9 z" fill="#38bdf8" opacity="0.85" />
    <circle cx="20" cy="26" r="6.5" fill="#f8fafc" />
    <circle cx="40" cy="26" r="6.5" fill="#f8fafc" />
    <circle cx="22" cy="27" r="3" fill="#121b2c" />
    <circle cx="42" cy="27" r="3" fill="#121b2c" />
  </g>

  <!-- Caption strip, bottom right -->
  <text x="1140" y="596" fill="#94a3b8" font-family="'Segoe UI', Tahoma, sans-serif" font-size="18" font-weight="700" text-anchor="end" opacity="0.9">an input in a state has a meaning</text>
</svg>
