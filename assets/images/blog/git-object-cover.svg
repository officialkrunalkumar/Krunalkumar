<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="A commit graph with a feature branch merging into main, branch labels as sticky notes, HEAD pointing at main, and a faded reflog trail remembering a discarded commit">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121b2c" />
      <stop offset="1" stop-color="#1f2c3f" />
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#ground)" />
  <ellipse cx="640" cy="330" rx="470" ry="270" fill="url(#glow)" />

  <!-- Main line: five commits left to right along y=380 -->
  <g stroke="#7dd3fc" stroke-width="4" fill="none">
    <path d="M150 380 H400" />
    <path d="M400 380 H650" />
    <path d="M650 380 H900" />
    <path d="M900 380 H1050" opacity="0.9" />
  </g>
  <!-- Feature branch: departs after second commit, two commits up at y=220, merges into the 5th -->
  <g stroke="#4ade80" stroke-width="4" fill="none">
    <path d="M400 380 C470 380 470 220 540 220" />
    <path d="M540 220 H740" />
    <path d="M740 220 C830 220 830 380 900 380" />
  </g>

  <!-- Reflog ghost: an abandoned commit above main, dashed and faded -->
  <g opacity="0.38">
    <path d="M650 380 C700 380 700 500 760 500" stroke="#94a3b8" stroke-width="3.5" stroke-dasharray="7 7" fill="none" />
    <circle cx="800" cy="500" r="26" fill="#131f2d" stroke="#94a3b8" stroke-width="3" stroke-dasharray="6 6" />
    <text x="800" y="556" fill="#94a3b8" font-family="'Segoe UI', Tahoma, sans-serif" font-size="17" font-weight="700" text-anchor="middle">only the reflog remembers</text>
  </g>

  <!-- Commits: circles. Main = sky, feature = green, merge = both -->
  <g stroke-width="4">
    <circle cx="150" cy="380" r="26" fill="#131f2d" stroke="#7dd3fc" />
    <circle cx="400" cy="380" r="26" fill="#131f2d" stroke="#7dd3fc" />
    <circle cx="650" cy="380" r="26" fill="#131f2d" stroke="#7dd3fc" />
    <circle cx="540" cy="220" r="26" fill="#131f2d" stroke="#4ade80" />
    <circle cx="740" cy="220" r="26" fill="#131f2d" stroke="#4ade80" />
    <!-- merge commit: two parents -->
    <circle cx="900" cy="380" r="28" fill="#131f2d" stroke="#38bdf8" stroke-width="5" />
  </g>

  <!-- Sticky-note branch labels -->
  <g font-family="Consolas, 'Courier New', monospace" font-size="22" font-weight="700">
    <rect x="836" y="428" width="128" height="42" rx="8" fill="#38bdf8" opacity="0.92" transform="rotate(-2 900 449)" />
    <text x="900" y="456" fill="#121b2c" text-anchor="middle" transform="rotate(-2 900 449)">main</text>
    <rect x="666" y="140" width="148" height="42" rx="8" fill="#4ade80" opacity="0.92" transform="rotate(2 740 161)" />
    <text x="740" y="168" fill="#121b2c" text-anchor="middle" transform="rotate(2 740 161)">feature</text>
  </g>

  <!-- HEAD arrow pointing at main's sticky note -->
  <g>
    <text x="1052" y="510" fill="#f8fafc" font-family="Consolas, 'Courier New', monospace" font-size="24" font-weight="700" text-anchor="middle">HEAD</text>
    <path d="M1030 494 C990 470 970 462 942 452" stroke="#f8fafc" stroke-width="3.5" fill="none" />
    <path d="M956 460 L938 450 L952 442" stroke="#f8fafc" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Object-store hashes drifting along the top -->
  <g fill="#94a3b8" font-family="Consolas, 'Courier New', monospace" font-size="17" opacity="0.6">
    <text x="150" y="90">blob 9f4e2c</text>
    <text x="360" y="66">tree 51b7d0</text>
    <text x="580" y="92">commit 5942ac</text>
    <text x="820" y="64">tree c39f7f</text>
    <text x="1020" y="92">blob 27f095</text>
  </g>

  <!-- Caption -->
  <text x="1140" y="596" fill="#94a3b8" font-family="'Segoe UI', Tahoma, sans-serif" font-size="18" font-weight="700" text-anchor="end" opacity="0.9">a branch is a sticky note on a commit</text>
</svg>
