<svg width="1160" height="540" viewBox="0 0 1160 540" role="img" aria-labelledby="d-how-cybercrime-cases-are-solved-diagram1" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <title id="d-how-cybercrime-cases-are-solved-diagram1">Lifecycle of a cybercrime case as two tracks: the victim track (detect, contain and preserve, report) and the law-enforcement track (FIR or NCR, freezes and notices, seizure) converge at digital forensics, which leads to the charge sheet and then trial</title>
                  <defs>
                    <marker id="case-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
                      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
                    </marker>
                  </defs>
                  <g>
                    <text x="40" y="52" fill="#1e77a4" font-size="20" font-weight="800" letter-spacing="3">HOW A CYBERCRIME CASE MOVES</text>

                    <!-- Victim track -->
                    <text x="40" y="98" fill="#1e77a4" font-size="15" font-weight="800" letter-spacing="2">VICTIM / COMPANY TRACK</text>
                    <rect x="40" y="114" width="180" height="88" rx="12" fill="none" stroke="#1e77a4" stroke-width="1.5"/>
                    <text x="60" y="150" fill="#6b7a90" font-size="18" font-weight="800">Detect</text>
                    <text x="60" y="178" fill="#64748b" font-size="15">alert · fraud · tip-off</text>
                    <rect x="252" y="114" width="200" height="88" rx="12" fill="none" stroke="#1e77a4" stroke-width="1.5"/>
                    <text x="272" y="150" fill="#6b7a90" font-size="18" font-weight="800">Contain &amp; preserve</text>
                    <text x="272" y="178" fill="#64748b" font-size="15">isolate — don't wipe</text>
                    <rect x="484" y="114" width="200" height="88" rx="12" fill="none" stroke="#1e77a4" stroke-width="1.5"/>
                    <text x="504" y="150" fill="#6b7a90" font-size="18" font-weight="800">Report fast</text>
                    <text x="504" y="178" fill="#64748b" font-size="15">1930 · NCRP · cyber cell</text>
                    <line x1="222" y1="158" x2="246" y2="158" stroke="#64748b" stroke-width="2.5" marker-end="url(#case-arr)"/>
                    <line x1="454" y1="158" x2="478" y2="158" stroke="#64748b" stroke-width="2.5" marker-end="url(#case-arr)"/>

                    <!-- Law-enforcement track -->
                    <text x="40" y="280" fill="#93671a" font-size="15" font-weight="800" letter-spacing="2">LAW-ENFORCEMENT TRACK</text>
                    <rect x="40" y="296" width="180" height="88" rx="12" fill="none" stroke="#93671a" stroke-width="1.5"/>
                    <text x="60" y="332" fill="#6b7a90" font-size="18" font-weight="800">FIR / NCR</text>
                    <text x="60" y="360" fill="#64748b" font-size="15">complaint registered</text>
                    <rect x="252" y="296" width="200" height="88" rx="12" fill="none" stroke="#93671a" stroke-width="1.5"/>
                    <text x="272" y="332" fill="#6b7a90" font-size="18" font-weight="800">Freeze &amp; notices</text>
                    <text x="272" y="360" fill="#64748b" font-size="15">money trail · BNSS s94</text>
                    <rect x="484" y="296" width="200" height="88" rx="12" fill="none" stroke="#93671a" stroke-width="1.5"/>
                    <text x="504" y="332" fill="#6b7a90" font-size="18" font-weight="800">Seizure</text>
                    <text x="504" y="360" fill="#64748b" font-size="15">hash · memo · witnesses</text>
                    <line x1="222" y1="340" x2="246" y2="340" stroke="#64748b" stroke-width="2.5" marker-end="url(#case-arr)"/>
                    <line x1="454" y1="340" x2="478" y2="340" stroke="#64748b" stroke-width="2.5" marker-end="url(#case-arr)"/>

                    <!-- Convergence -->
                    <path d="M684 158 L738 208" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#case-arr)"/>
                    <path d="M684 340 L738 290" stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#case-arr)"/>

                    <!-- Forensics -->
                    <rect x="744" y="150" width="200" height="198" rx="14" fill="none" stroke="#8f49df" stroke-width="2"/>
                    <text x="764" y="188" fill="#6b7a90" font-size="19" font-weight="800">Digital forensics</text>
                    <text x="764" y="222" fill="#6b7a90" font-size="15">image → hash</text>
                    <text x="764" y="248" fill="#6b7a90" font-size="15">examine → analyze</text>
                    <text x="764" y="274" fill="#6b7a90" font-size="15">report (FSL)</text>
                    <text x="764" y="316" fill="#64748b" font-size="15">chain of custody intact</text>

                    <!-- To court -->
                    <line x1="944" y1="187" x2="978" y2="187" stroke="#64748b" stroke-width="2.5" marker-end="url(#case-arr)"/>
                    <rect x="984" y="150" width="140" height="74" rx="12" fill="none" stroke="#157f41" stroke-width="1.5"/>
                    <text x="1004" y="182" fill="#6b7a90" font-size="17" font-weight="800">Charge sheet</text>
                    <text x="1004" y="208" fill="#64748b" font-size="15">before court</text>
                    <line x1="1054" y1="224" x2="1054" y2="250" stroke="#64748b" stroke-width="2.5" marker-end="url(#case-arr)"/>
                    <rect x="984" y="256" width="140" height="74" rx="12" fill="none" stroke="#157f41" stroke-width="1.5"/>
                    <text x="1004" y="288" fill="#6b7a90" font-size="17" font-weight="800">Trial</text>
                    <text x="1004" y="314" fill="#64748b" font-size="15">evidence tested</text>

                    <text x="40" y="470" fill="#64748b" font-size="15">Two tracks, one evidence stream. Every handoff along the way is recorded in the chain of custody —</text>
                    <text x="40" y="496" fill="#64748b" font-size="15">and every gap in that record is a question the defence gets to ask at trial.</text>
                  </g>
                </svg>
