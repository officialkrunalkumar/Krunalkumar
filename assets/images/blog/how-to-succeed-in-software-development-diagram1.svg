<svg width="760" height="220" viewBox="0 0 760 220" role="img" aria-labelledby="d-how-to-succeed-in-software-development-diagram1" xmlns="http://www.w3.org/2000/svg">
  <title id="d-how-to-succeed-in-software-development-diagram1">Four ascending steps: make it work, make it modular, make it readable, make it optimized</title>
                  <rect width="760" height="220" rx="18" fill="#1b2735"/>
                  <g font-family="'Segoe UI',sans-serif" text-anchor="middle" font-weight="800">
                    <rect x="60" y="150" width="150" height="40" rx="8" fill="#38bdf8" opacity="0.55"/>
                    <text x="135" y="176" fill="#131f2d" font-size="13">1 · Work</text>
                    <rect x="230" y="115" width="150" height="75" rx="8" fill="#38bdf8" opacity="0.7"/>
                    <text x="305" y="158" fill="#131f2d" font-size="13">2 · Modular</text>
                    <rect x="400" y="80" width="150" height="110" rx="8" fill="#38bdf8" opacity="0.85"/>
                    <text x="475" y="140" fill="#131f2d" font-size="13">3 · Readable</text>
                    <rect x="570" y="45" width="150" height="145" rx="8" fill="#7dd3fc"/>
                    <text x="645" y="120" fill="#131f2d" font-size="13">4 · Optimized</text>
                  </g>
                </svg>
