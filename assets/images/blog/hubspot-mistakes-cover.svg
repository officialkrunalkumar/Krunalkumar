    <text x="786" y="336">PROPERTIES</text>
  </g>
  <rect x="756" y="380" width="288" height="46" rx="9" fill="none" stroke="#f87171" stroke-width="5" stroke-dasharray="14 10"/>
  <text x="786" y="410" font-family="'Segoe UI',sans-serif" font-size="19" font-weight="800" fill="#fca5a5">OBJECT MODEL</text>
  <text x="786" y="452" font-family="'Segoe UI',sans-serif" font-size="17" font-weight="600" fill="#94a3b8">everything above sits on this</text>
