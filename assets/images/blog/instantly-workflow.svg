    <g id="i-globe"><circle cx="12" cy="12" r="8.6" fill="none" stroke="#2563eb" stroke-width="1.8"/><ellipse cx="12" cy="12" rx="3.8" ry="8.6" fill="none" stroke="#2563eb" stroke-width="1.4"/><path d="M3.4 12 h17.2" stroke="#2563eb" stroke-width="1.4"/></g>
