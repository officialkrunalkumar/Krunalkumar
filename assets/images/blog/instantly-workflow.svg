    <g id="i-if"><rect x="4" y="6" width="16" height="2.6" rx="1.3" fill="#16a34a"/><rect x="4" y="10.7" width="16" height="2.6" rx="1.3" fill="#16a34a"/><rect x="4" y="15.4" width="16" height="2.6" rx="1.3" fill="#16a34a"/><circle cx="9" cy="7.3" r="2" fill="#16a34a" stroke="#f8fafc" stroke-width="1"/><circle cx="15" cy="12" r="2" fill="#16a34a" stroke="#f8fafc" stroke-width="1"/><circle cx="10.5" cy="16.7" r="2" fill="#16a34a" stroke="#f8fafc" stroke-width="1"/></g>
    <g id="i-slack"><rect x="10.6" y="3.5" width="2.9" height="17" rx="1.4" fill="#36C5F0" transform="translate(-3.4 0)"/><rect x="10.6" y="3.5" width="2.9" height="17" rx="1.4" fill="#E01E5A" transform="translate(3.4 0)"/><rect x="3.5" y="10.6" width="17" height="2.9" rx="1.4" fill="#2EB67D" transform="translate(0 -3.4)"/><rect x="3.5" y="10.6" width="17" height="2.9" rx="1.4" fill="#ECB22E" transform="translate(0 3.4)"/></g>
    <g id="i-ai"><circle cx="12" cy="12" r="9.4" fill="#172437"/><g stroke="#f8fafc" stroke-width="2" stroke-linecap="round"><path d="M12 5.4 V18.6"/><path d="M6.3 8.7 L17.7 15.3"/><path d="M6.3 15.3 L17.7 8.7"/></g></g>
    <g id="i-doc"><rect x="6" y="3" width="12" height="18" rx="2" fill="#4285F4"/><g stroke="#ffffff" stroke-width="1.4"><path d="M9 9.5 h6"/><path d="M9 12.5 h6"/><path d="M9 15.5 h4"/></g></g>
    <g id="i-braces"><text x="12" y="17.5" font-size="14" font-weight="800" fill="#172437" text-anchor="middle" font-family="Consolas, monospace">{ }</text></g>
