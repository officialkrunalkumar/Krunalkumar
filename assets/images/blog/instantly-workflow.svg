<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1217 384" role="img" aria-label="Authentic n8n canvas of the Instantly CleverResponder workflow: a reply is matched to its lead by UUID, classified and drafted by AI grounded in a knowledge doc, approved in Slack, sent, and followed up with a three-day reminder loop" font-family="'Segoe UI', Tahoma, sans-serif">
  <defs>
    <pattern id="dotgrid2" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.1" fill="#1e293b"/>
