  <rect x="714" y="262" width="300" height="9" rx="4.5" fill="#4ade80" opacity="0.75"/>
  <text x="714" y="292" fill="#94a3b8" font-family="'Segoe UI',sans-serif" font-size="14" font-weight="800" letter-spacing="2">DEBUGGING METHOD</text>

  <rect x="688" y="316" width="412" height="58" rx="10" fill="rgba(125,211,252,0.10)" stroke="#7dd3fc" stroke-width="2" stroke-opacity="0.55"/>
  <rect x="688" y="316" width="7" height="58" rx="3.5" fill="#7dd3fc"/>
  <rect x="714" y="332" width="222" height="9" rx="4.5" fill="#7dd3fc" opacity="0.8"/>
  <text x="714" y="362" fill="#94a3b8" font-family="'Segoe UI',sans-serif" font-size="14" font-weight="800" letter-spacing="2">COMMUNICATION</text>

  <rect x="688" y="386" width="412" height="58" rx="10" fill="rgba(251,191,36,0.10)" stroke="#fbbf24" stroke-width="2" stroke-opacity="0.55"/>
  <rect x="688" y="386" width="7" height="58" rx="3.5" fill="#fbbf24"/>
  <rect x="714" y="402" width="278" height="9" rx="4.5" fill="#fbbf24" opacity="0.7"/>
  <text x="714" y="432" fill="#94a3b8" font-family="'Segoe UI',sans-serif" font-size="14" font-weight="800" letter-spacing="2">DO THEY ASK FIRST</text>

  <rect x="688" y="456" width="412" height="58" rx="10" fill="rgba(125,211,252,0.10)" stroke="#7dd3fc" stroke-width="2" stroke-opacity="0.55"/>
  <rect x="688" y="456" width="7" height="58" rx="3.5" fill="#7dd3fc"/>
  <rect x="714" y="472" width="196" height="9" rx="4.5" fill="#7dd3fc" opacity="0.8"/>
