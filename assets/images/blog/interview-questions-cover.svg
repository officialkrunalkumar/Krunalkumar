    <text x="80" y="420" fill="#e2e8f0" font-size="26" font-weight="600">And what each one is really</text>
    <text x="80" y="456" fill="#e2e8f0" font-size="26" font-weight="600">testing, from the other side</text>
    <text x="80" y="556" fill="#94a3b8" font-size="24" font-weight="700">krunalkumar.dpdns.org · Blog</text>
