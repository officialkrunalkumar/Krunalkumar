<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Cover image: How to read a job description — a requirements list with three lines marked as load-bearing and two left as wishes">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121b2c"/>
      <stop offset="1" stop-color="#1f2c3f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <g fill="#e2e8f0" opacity="0.35">
    <circle cx="150" cy="82" r="2"/><circle cx="430" cy="58" r="1.5"/><circle cx="700" cy="96" r="2"/>
    <circle cx="96" cy="452" r="1.5"/><circle cx="352" cy="566" r="2"/><circle cx="1128" cy="86" r="1.5"/>
    <circle cx="1044" cy="596" r="2"/><circle cx="648" cy="588" r="1.5"/>
  </g>

  <!-- The requirements list, sorted -->
  <rect x="716" y="128" width="404" height="374" rx="16" fill="rgba(125,211,252,0.06)" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.4"/>
  <text x="748" y="176" fill="#7dd3fc" font-family="'Segoe UI',sans-serif" font-size="19" font-weight="800" letter-spacing="4">REQUIREMENTS</text>

  <rect x="748" y="200" width="340" height="40" rx="8" fill="rgba(74,222,128,0.14)" stroke="#4ade80" stroke-width="2"/>
  <rect x="748" y="200" width="8" height="40" rx="4" fill="#4ade80"/>
  <rect x="778" y="212" width="212" height="9" rx="4.5" fill="#4ade80" opacity="0.9"/>
  <rect x="778" y="228" width="128" height="7" rx="3.5" fill="#4ade80" opacity="0.45"/>

  <rect x="748" y="254" width="340" height="40" rx="8" fill="rgba(74,222,128,0.14)" stroke="#4ade80" stroke-width="2"/>
  <rect x="748" y="254" width="8" height="40" rx="4" fill="#4ade80"/>
  <rect x="778" y="266" width="180" height="9" rx="4.5" fill="#4ade80" opacity="0.9"/>
  <rect x="778" y="282" width="104" height="7" rx="3.5" fill="#4ade80" opacity="0.45"/>

  <rect x="748" y="308" width="340" height="40" rx="8" fill="rgba(148,163,184,0.08)" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 6"/>
  <rect x="778" y="320" width="196" height="9" rx="4.5" fill="#94a3b8" opacity="0.55"/>
  <rect x="778" y="336" width="112" height="7" rx="3.5" fill="#94a3b8" opacity="0.3"/>

  <rect x="748" y="362" width="340" height="40" rx="8" fill="rgba(74,222,128,0.14)" stroke="#4ade80" stroke-width="2"/>
  <rect x="748" y="362" width="8" height="40" rx="4" fill="#4ade80"/>
  <rect x="778" y="374" width="160" height="9" rx="4.5" fill="#4ade80" opacity="0.9"/>
  <rect x="778" y="390" width="94" height="7" rx="3.5" fill="#4ade80" opacity="0.45"/>

  <rect x="748" y="416" width="340" height="40" rx="8" fill="rgba(148,163,184,0.08)" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 6"/>
  <rect x="778" y="428" width="224" height="9" rx="4.5" fill="#94a3b8" opacity="0.55"/>
  <rect x="778" y="444" width="136" height="7" rx="3.5" fill="#94a3b8" opacity="0.3"/>

  <text x="748" y="484" fill="#4ade80" font-family="'Segoe UI',sans-serif" font-size="17" font-weight="700">solid = real  ·  dashed = a wish</text>

  <g font-family="'Segoe UI', Tahoma, sans-serif">
    <text x="80" y="196" fill="#7dd3fc" font-size="26" font-weight="800" letter-spacing="8">CAREER</text>
    <text x="80" y="272" fill="#f8fafc" font-size="52" font-weight="800">How to read a job</text>
    <text x="80" y="334" fill="#f8fafc" font-size="52" font-weight="800">description</text>
    <text x="80" y="416" fill="#e2e8f0" font-size="26" font-weight="600">What is a real requirement, what</text>
    <text x="80" y="452" fill="#e2e8f0" font-size="26" font-weight="600">is a wish, and what is a warning</text>
    <text x="80" y="556" fill="#94a3b8" font-size="24" font-weight="700">krunalkumar.dpdns.org · Blog</text>
  </g>
</svg>
