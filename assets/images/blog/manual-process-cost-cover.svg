<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Cover image: the real cost of a manual process — a stacked bar whose solid lower block is the cost people quote and whose lighter upper blocks are the costs nobody counts">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121b2c"/>
      <stop offset="1" stop-color="#1f2c3f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- one stacked bar: the block that gets quoted, and the blocks above it that do not -->
  <text x="742" y="152" fill="#7dd3fc" font-family="'Segoe UI',sans-serif" font-size="17" font-weight="800" letter-spacing="3">COST OF ONE MANUAL STEP</text>

  <g>
    <rect x="860" y="180" width="140" height="50" fill="#38bdf8" opacity="0.28"/>
    <rect x="860" y="232" width="140" height="58" fill="#38bdf8" opacity="0.42"/>
    <rect x="860" y="292" width="140" height="48" fill="#38bdf8" opacity="0.58"/>
    <rect x="860" y="344" width="140" height="140" fill="#7dd3fc"/>
  </g>
  <path d="M 760 342 L 1104 342" stroke="#f87171" stroke-width="3" stroke-dasharray="12 9" fill="none"/>

  <g font-family="'Segoe UI',sans-serif" font-weight="700">
    <text x="1018" y="258" fill="#e2e8f0" font-size="21">the rest</text>
    <text x="1018" y="424" fill="#94a3b8" font-size="21">quoted</text>
    <text x="760" y="512" fill="#94a3b8" font-size="19">rework &#183; switching &#183; queue &#183; key person</text>
  </g>

  <g font-family="'Segoe UI', Tahoma, sans-serif">
    <text x="80" y="190" fill="#7dd3fc" font-size="26" font-weight="800" letter-spacing="8">BUSINESS</text>
    <text x="80" y="268" fill="#f8fafc" font-size="52" font-weight="800">The real cost of</text>
    <text x="80" y="334" fill="#f8fafc" font-size="52" font-weight="800">a manual process</text>
    <text x="80" y="404" fill="#e2e8f0" font-size="27" font-weight="600">Minutes &#215; frequency &#215; loaded rate &#8212;</text>
    <text x="80" y="444" fill="#e2e8f0" font-size="27" font-weight="600">then the four costs nobody counts.</text>
    <text x="80" y="545" fill="#94a3b8" font-size="24" font-weight="700">krunalkumar.dpdns.org &#183; Blog</text>
  </g>
</svg>
