<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Cover image: The resume-builder paywall trick. A typed resume flows toward a download button that conceals a price tag">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121b2c"/>
      <stop offset="1" stop-color="#1f2c3f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- the resume you typed -->
  <rect x="860" y="110" width="150" height="200" rx="12" fill="none" stroke="#7dd3fc" stroke-width="4"/>
  <circle cx="895" cy="150" r="16" fill="#7dd3fc" opacity="0.9"/>
  <g stroke="#7dd3fc" stroke-width="4" stroke-linecap="round" opacity="0.9">
    <line x1="925" y1="142" x2="988" y2="142"/>
    <line x1="925" y1="158" x2="972" y2="158"/>
  </g>
  <g stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round" opacity="0.85">
    <line x1="884" y1="192" x2="988" y2="192"/>
    <line x1="884" y1="210" x2="988" y2="210"/>
    <line x1="884" y1="228" x2="964" y2="228"/>
    <line x1="884" y1="252" x2="988" y2="252"/>
    <line x1="884" y1="270" x2="948" y2="270"/>
  </g>
  <text x="935" y="95" fill="#94a3b8" font-family="'Segoe UI',Tahoma,sans-serif" font-size="17" font-weight="700" text-anchor="middle">an hour of typing</text>

  <!-- flows to the download button -->
  <g stroke="#38bdf8" stroke-width="3" fill="none" opacity="0.85">
    <path d="M 935 310 L 935 356"/>
    <path d="M 924 344 L 935 356 L 946 344"/>
  </g>

  <!-- the button, with the price tag hiding behind it -->
  <g transform="rotate(12 1046 428)">
    <path d="M 1016 404 L 1076 404 L 1096 424 L 1076 444 L 1016 444 Q 1006 444 1006 434 L 1006 414 Q 1006 404 1016 404 Z"
          fill="#f87171" opacity="0.95"/>
    <circle cx="1080" cy="424" r="5" fill="#131f2d"/>
    <text x="1042" y="431" fill="#131f2d" font-family="'Segoe UI',Tahoma,sans-serif" font-size="19" font-weight="800" text-anchor="middle">&#8377;&#8377;&#8377;</text>
  </g>
  <rect x="850" y="372" width="170" height="56" rx="12" fill="#7dd3fc"/>
  <text x="935" y="408" fill="#131f2d" font-family="'Segoe UI',Tahoma,sans-serif" font-size="22" font-weight="800" text-anchor="middle">Download</text>
  <text x="935" y="472" fill="#f87171" font-family="'Segoe UI',Tahoma,sans-serif" font-size="18" font-weight="800" text-anchor="middle">the price waits here</text>

  <g font-family="'Segoe UI', Tahoma, sans-serif">
    <text x="80" y="185" fill="#7dd3fc" font-size="24" font-weight="800" letter-spacing="7">SECURITY</text>
    <text x="80" y="262" fill="#f8fafc" font-size="56" font-weight="800">The resume-builder</text>
    <text x="80" y="328" fill="#f8fafc" font-size="56" font-weight="800">paywall trick</text>
    <text x="80" y="396" fill="#e2e8f0" font-size="29" font-weight="600">The editor is free until your</text>
    <text x="80" y="437" fill="#e2e8f0" font-size="29" font-weight="600">work history is typed in.</text>
    <text x="80" y="540" fill="#94a3b8" font-size="24" font-weight="700">krunalkumar.dpdns.org &#183; Blog</text>
  </g>
</svg>
