<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Cover image: two quote ranges compared, a wide one from a vague brief and a narrow one from a detailed brief, with the difference marked as priced uncertainty">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121b2c"/>
      <stop offset="1" stop-color="#1f2c3f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <g fill="none" stroke="#38bdf8" stroke-width="3">
    <rect x="720" y="140" width="380" height="350" rx="14" stroke-opacity="0.35"/>
  </g>
  <text x="756" y="188" font-family="'Segoe UI',sans-serif" font-size="18" font-weight="700" letter-spacing="3" fill="#7dd3fc">QUOTED RANGE</text>
  <path d="M756 208 L756 378" stroke="#7dd3fc" stroke-width="2" stroke-dasharray="6 8" stroke-opacity="0.45" fill="none"/>
  <text x="756" y="248" font-family="'Segoe UI',sans-serif" font-size="19" font-weight="600" fill="#94a3b8">Vague brief</text>
  <rect x="756" y="260" width="310" height="20" rx="10" fill="#f87171" opacity="0.8"/>
  <text x="756" y="326" font-family="'Segoe UI',sans-serif" font-size="19" font-weight="600" fill="#94a3b8">Detailed brief</text>
  <rect x="756" y="338" width="120" height="20" rx="10" fill="#38bdf8" opacity="0.9"/>
  <g stroke="#7dd3fc" stroke-width="3" stroke-opacity="0.75" fill="none" stroke-linecap="round">
    <path d="M876 398 L1066 398"/>
    <path d="M876 390 L876 406"/>
    <path d="M1066 390 L1066 406"/>
  </g>
  <text x="971" y="432" font-family="'Segoe UI',sans-serif" font-size="19" font-weight="600" fill="#7dd3fc" text-anchor="middle">priced uncertainty</text>
  <text x="756" y="468" font-family="'Segoe UI',sans-serif" font-size="18" font-weight="600" fill="#94a3b8">Same floor, different ceiling</text>
  <g font-family="'Segoe UI', Tahoma, sans-serif">
    <text x="80" y="200" fill="#7dd3fc" font-size="26" font-weight="800" letter-spacing="8">SECURITY</text>
    <text x="80" y="280" fill="#f8fafc" font-size="52" font-weight="800">Brief the consultant</text>
    <text x="80" y="345" fill="#f8fafc" font-size="52" font-weight="800">before the quote</text>
    <text x="80" y="422" fill="#e2e8f0" font-size="26" font-weight="600">Vagueness is priced, not absorbed</text>
    <text x="80" y="545" fill="#94a3b8" font-size="24" font-weight="700">krunalkumar.dpdns.org &#183; Blog</text>
  </g>
</svg>
