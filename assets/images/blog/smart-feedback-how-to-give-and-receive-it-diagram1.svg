<svg width="760" height="200" viewBox="0 0 760 200" role="img" aria-labelledby="d-smart-feedback-how-to-give-and-receive-it-diagram1" xmlns="http://www.w3.org/2000/svg">
  <title id="d-smart-feedback-how-to-give-and-receive-it-diagram1">Three-step feedback structure: Observation, Impact, Path forward</title>
                  <rect width="760" height="200" rx="18" fill="#1b2735"/>
                  <g font-family="'Segoe UI',sans-serif" text-anchor="middle">
                    <circle cx="140" cy="100" r="46" fill="none" stroke="#7dd3fc" stroke-width="3"/>
                    <text x="140" y="95" fill="#e2e8f0" font-size="14" font-weight="800">Observation</text>
                    <text x="140" y="118" fill="#94a3b8" font-size="11" font-weight="600">what I saw</text>
                    <circle cx="380" cy="100" r="46" fill="none" stroke="#7dd3fc" stroke-width="3"/>
                    <text x="380" y="95" fill="#e2e8f0" font-size="14" font-weight="800">Impact</text>
                    <text x="380" y="118" fill="#94a3b8" font-size="11" font-weight="600">why it matters</text>
                    <circle cx="620" cy="100" r="46" fill="#7dd3fc"/>
                    <text x="620" y="95" fill="#131f2d" font-size="14" font-weight="800">Path</text>
                    <text x="620" y="118" fill="#131f2d" font-size="11" font-weight="700">what's next</text>
                    <path d="M 192 100 L 328 100" stroke="#475569" stroke-width="3"/>
                    <path d="M 320 93 L 334 100 L 320 107 Z" fill="#475569"/>
                    <path d="M 432 100 L 568 100" stroke="#475569" stroke-width="3"/>
                    <path d="M 560 93 L 574 100 L 560 107 Z" fill="#475569"/>
                  </g>
                </svg>
