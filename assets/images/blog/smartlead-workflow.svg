  <!-- The canvas stays dark on purpose: this is a faithful reproduction of the
       real n8n editor, which is dark, and lightening it would make the diagram
       lie about the tool. What it needed instead was an edge. Without this the
       figure bleeds into a light-theme page as an unexplained dark rectangle;
       with it, it reads as a framed screenshot. #6b7a90 is the same neutral the
       other blog diagrams use, and it is the near-optimal choice for a stroke
       that must stay visible on BOTH the dark (#121b2c) and light (#f5f8fc)
       page grounds — 3.95:1 and 4.10:1. Inset by half the stroke width so the
       border is not clipped by the viewBox edge. -->
  <rect x="0.75" y="0.75" width="1219.5" height="465.5" rx="13.25" fill="none" stroke="#6b7a90" stroke-width="1.5"/>
  <text x="20" y="26" fill="#7dd3fc" font-size="12" font-weight="800" letter-spacing="2.5">CLEVERRESPONDER · SMARTLEAD — n8n CANVAS</text>

