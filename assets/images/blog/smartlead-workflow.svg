<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1221 467" role="img" aria-label="Authentic n8n canvas of the SmartLead CleverResponder workflow: Receive Replies, Set Email Body, and a rules-based Route Reply switch fan out to a meeting branch with calendar link and reminders, and an AI branch where suggested replies are approved in Slack before sending" font-family="system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif">
