<svg width="760" height="280" viewBox="0 0 760 280" role="img" aria-labelledby="d-the-four-ms-every-business-needs-diagram1" xmlns="http://www.w3.org/2000/svg">
  <title id="d-the-four-ms-every-business-needs-diagram1">Four pillars — manpower, money, mind — supporting a beam, with management as the structure that binds them</title>
                  <rect width="760" height="280" rx="18" fill="#1b2735"/>
                  <rect x="150" y="60" width="460" height="22" rx="6" fill="#7dd3fc"/>
                  <text x="380" y="46" fill="#94a3b8" font-family="'Segoe UI',sans-serif" font-size="13" font-weight="700" text-anchor="middle">A WORKING BUSINESS</text>
                  <g font-family="'Segoe UI',sans-serif" font-size="14" font-weight="800" text-anchor="middle">
                    <rect x="180" y="95" width="90" height="130" rx="8" fill="#38bdf8" opacity="0.65"/>
                    <text x="225" y="165" fill="#131f2d">Manpower</text>
                    <rect x="335" y="95" width="90" height="130" rx="8" fill="#38bdf8" opacity="0.8"/>
                    <text x="380" y="165" fill="#131f2d">Money</text>
                    <rect x="490" y="95" width="90" height="130" rx="8" fill="#7dd3fc"/>
                    <text x="535" y="165" fill="#131f2d">Mind</text>
                  </g>
                  <rect x="150" y="238" width="460" height="20" rx="6" fill="#334155"/>
                  <text x="380" y="253" fill="#e2e8f0" font-family="'Segoe UI',sans-serif" font-size="13" font-weight="800" text-anchor="middle">MANAGEMENT — the foundation that aligns them</text>
                </svg>
