<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Cover image: The surface, deep, and dark web. Three vignettes — pages under a magnifier, a page behind a padlock, and a message passed along a chain of three relays">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121b2c"/>
      <stop offset="1" stop-color="#1f2c3f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Deliberately not an iceberg: three vignettes, one per way of reaching a
       page. Nothing is stacked, because depth is not the axis. -->

  <!-- Indexed: three linked pages under a magnifier -->
  <g transform="translate(790,120)">
    <rect x="0" y="0" width="52" height="66" rx="6" fill="none" stroke="#7dd3fc" stroke-width="3"/>
    <rect x="76" y="0" width="52" height="66" rx="6" fill="none" stroke="#7dd3fc" stroke-width="3"/>
    <rect x="152" y="0" width="52" height="66" rx="6" fill="none" stroke="#7dd3fc" stroke-width="3"/>
    <g stroke="#38bdf8" stroke-width="3" stroke-linecap="round">
      <line x1="52" y1="33" x2="76" y2="33"/>
      <line x1="128" y1="33" x2="152" y2="33"/>
    </g>
    <circle cx="232" cy="26" r="20" fill="none" stroke="#38bdf8" stroke-width="4"/>
    <line x1="246" y1="41" x2="264" y2="59" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
    <text x="0" y="98" fill="#94a3b8" font-family="'Segoe UI', Tahoma, sans-serif" font-size="20" font-weight="700">indexed</text>
  </g>

  <!-- Signed in: a page behind a padlock -->
  <g transform="translate(790,262)">
    <rect x="0" y="0" width="52" height="66" rx="6" fill="none" stroke="#94a3b8" stroke-width="3"/>
    <g stroke="#94a3b8" stroke-width="3" stroke-linecap="round" opacity="0.85">
      <line x1="12" y1="18" x2="40" y2="18"/>
      <line x1="12" y1="33" x2="40" y2="33"/>
      <line x1="12" y1="48" x2="30" y2="48"/>
    </g>
    <path d="M84 30 v-8 a16 16 0 0 1 32 0 v8" fill="none" stroke="#7dd3fc" stroke-width="5"/>
    <rect x="76" y="30" width="48" height="38" rx="8" fill="#7dd3fc"/>
    <circle cx="100" cy="47" r="5" fill="#131f2d"/>
    <rect x="98" y="47" width="4" height="12" rx="2" fill="#131f2d"/>
    <text x="0" y="98" fill="#94a3b8" font-family="'Segoe UI', Tahoma, sans-serif" font-size="20" font-weight="700">signed in</text>
  </g>

  <!-- Relayed: you, three relays, a service -->
  <g transform="translate(790,404)">
    <g stroke="#a855f7" stroke-width="3" stroke-linecap="round" opacity="0.9">
      <line x1="16" y1="34" x2="52" y2="34"/>
      <line x1="86" y1="34" x2="118" y2="34"/>
      <line x1="152" y1="34" x2="184" y2="34"/>
      <line x1="218" y1="34" x2="250" y2="34"/>
    </g>
    <circle cx="8" cy="34" r="13" fill="#a855f7"/>
    <rect x="52" y="21" width="34" height="26" rx="6" fill="none" stroke="#a855f7" stroke-width="3"/>
    <rect x="118" y="21" width="34" height="26" rx="6" fill="none" stroke="#a855f7" stroke-width="3"/>
    <rect x="184" y="21" width="34" height="26" rx="6" fill="none" stroke="#a855f7" stroke-width="3"/>
    <circle cx="264" cy="34" r="13" fill="none" stroke="#a855f7" stroke-width="4"/>
    <text x="0" y="98" fill="#94a3b8" font-family="'Segoe UI', Tahoma, sans-serif" font-size="20" font-weight="700">relayed</text>
  </g>

  <g font-family="'Segoe UI', Tahoma, sans-serif">
    <text x="80" y="185" fill="#7dd3fc" font-size="24" font-weight="800" letter-spacing="7">SECURITY</text>
    <text x="80" y="262" fill="#f8fafc" font-size="56" font-weight="800">The surface, deep,</text>
    <text x="80" y="328" fill="#f8fafc" font-size="56" font-weight="800">and dark web</text>
    <text x="80" y="396" fill="#e2e8f0" font-size="29" font-weight="600">Not three depths of one ocean.</text>
    <text x="80" y="437" fill="#e2e8f0" font-size="29" font-weight="600">Three ways of reaching a page.</text>
    <text x="80" y="540" fill="#94a3b8" font-size="24" font-weight="700">krunalkumar.dpdns.org &#183; Blog</text>
  </g>
</svg>
