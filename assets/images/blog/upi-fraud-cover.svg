<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Cover image: UPI fraud, how the money actually leaves — a phone showing a request card written by somebody else, a row of PIN digits, and a confirm bar reading PIN to pay, with an arrow carrying money out of the phone">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121b2c"/>
      <stop offset="1" stop-color="#1f2c3f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.44" r="0.58">
      <stop offset="0" stop-color="#f87171" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#f87171" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <g fill="#e2e8f0" opacity="0.35">
    <circle cx="140" cy="90" r="2"/><circle cx="430" cy="62" r="1.5"/><circle cx="690" cy="104" r="2"/>
    <circle cx="96" cy="430" r="1.5"/><circle cx="330" cy="548" r="2"/><circle cx="1140" cy="72" r="1.5"/>
    <circle cx="1058" cy="574" r="2"/><circle cx="628" cy="586" r="1.5"/>
  </g>

  <g font-family="'Segoe UI', Tahoma, sans-serif">
    <text x="80" y="172" fill="#7dd3fc" font-size="24" font-weight="800" letter-spacing="7">SECURITY</text>
    <text x="80" y="250" fill="#f8fafc" font-size="52" font-weight="800">UPI fraud: how the</text>
    <text x="80" y="314" fill="#f8fafc" font-size="52" font-weight="800">money actually leaves</text>
    <text x="80" y="384" fill="#e2e8f0" font-size="28" font-weight="600">The PIN authorises money leaving.</text>
    <text x="80" y="424" fill="#e2e8f0" font-size="28" font-weight="600">Always. Nothing else needs it.</text>
    <text x="80" y="542" fill="#94a3b8" font-size="24" font-weight="700">krunalkumar.dpdns.org &#183; Blog</text>
  </g>

  <!-- The phone. The card at the top is text a stranger typed; the bar at the
       bottom is the one line the app writes, and it never changes. -->
  <rect x="812" y="126" width="268" height="384" rx="30" fill="rgba(125,211,252,0.08)" stroke="#e2e8f0" stroke-width="6"/>

  <rect x="840" y="166" width="212" height="104" rx="12" fill="none" stroke="#94a3b8" stroke-width="3" stroke-dasharray="9 7"/>
  <g fill="#94a3b8" opacity="0.85">
    <rect x="858" y="190" width="120" height="8" rx="4"/>
    <rect x="858" y="214" width="164" height="8" rx="4"/>
    <rect x="858" y="238" width="96" height="8" rx="4"/>
  </g>

  <line x1="840" y1="300" x2="1052" y2="300" stroke="#475569" stroke-width="2"/>

  <g fill="#7dd3fc">
    <circle cx="861" cy="340" r="9"/><circle cx="895" cy="340" r="9"/><circle cx="929" cy="340" r="9"/>
    <circle cx="963" cy="340" r="9"/><circle cx="997" cy="340" r="9"/><circle cx="1031" cy="340" r="9"/>
  </g>

  <rect x="840" y="378" width="212" height="56" rx="14" fill="rgba(248,113,113,0.16)" stroke="#f87171" stroke-width="3"/>
  <text x="946" y="414" fill="#f87171" font-family="'Segoe UI', Tahoma, sans-serif" font-size="22" font-weight="800" letter-spacing="2" text-anchor="middle">PIN TO PAY</text>

  <path d="M1092 406 h48" stroke="#f87171" stroke-width="8" stroke-linecap="round" fill="none"/>
  <path d="M1136 390 l26 16 -26 16z" fill="#f87171"/>

  <text x="946" y="562" fill="#f87171" font-family="'Segoe UI', Tahoma, sans-serif" font-size="24" font-weight="800" letter-spacing="4" text-anchor="middle">MONEY LEAVES</text>
</svg>
