<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Cover image: How I vibe coded this website. A specification fans out to three review agents, which converge on a gate before anything ships">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121b2c"/>
      <stop offset="1" stop-color="#1f2c3f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- the spec -->
  <rect x="890" y="140" width="80" height="62" rx="9" fill="none" stroke="#7dd3fc" stroke-width="4"/>
  <g stroke="#7dd3fc" stroke-width="3.5" stroke-linecap="round" opacity="0.9">
    <line x1="906" y1="159" x2="954" y2="159"/>
    <line x1="906" y1="171" x2="954" y2="171"/>
    <line x1="906" y1="183" x2="936" y2="183"/>
  </g>
  <text x="930" y="127" fill="#94a3b8" font-family="'Segoe UI',Tahoma,sans-serif" font-size="17" font-weight="700" text-anchor="middle">the spec</text>

  <!-- fan out to three reviewers -->
  <g stroke="#38bdf8" stroke-width="3" fill="none" opacity="0.85">
    <path d="M 930 202 L 930 232 L 810 232 L 810 259"/>
    <path d="M 930 202 L 930 259"/>
    <path d="M 930 202 L 930 232 L 1050 232 L 1050 259"/>
  </g>

  <g>
    <rect x="786" y="259" width="48" height="48" rx="11" fill="#7dd3fc" opacity="0.92"/>
    <rect x="906" y="259" width="48" height="48" rx="11" fill="#7dd3fc" opacity="0.92"/>
    <rect x="1026" y="259" width="48" height="48" rx="11" fill="#7dd3fc" opacity="0.92"/>
    <g fill="#131f2d">
      <circle cx="801" cy="278" r="4"/><circle cx="819" cy="278" r="4"/>
      <circle cx="921" cy="278" r="4"/><circle cx="939" cy="278" r="4"/>
      <circle cx="1041" cy="278" r="4"/><circle cx="1059" cy="278" r="4"/>
    </g>
    <g stroke="#131f2d" stroke-width="3.5" fill="none" stroke-linecap="round">
      <path d="M 800 293 L 820 293"/>
      <path d="M 920 293 L 940 293"/>
      <path d="M 1040 293 L 1060 293"/>
    </g>
  </g>
  <text x="1104" y="290" fill="#94a3b8" font-family="'Segoe UI',Tahoma,sans-serif" font-size="17" font-weight="700" text-anchor="start">in parallel</text>

  <!-- converge on the gate -->
  <g stroke="#38bdf8" stroke-width="3" fill="none" opacity="0.85">
    <path d="M 810 307 L 810 350 L 930 350 L 930 372"/>
    <path d="M 930 307 L 930 372"/>
    <path d="M 1050 307 L 1050 350 L 930 350 L 930 372"/>
  </g>

  <!-- the gate: nothing ships without it -->
  <path d="M 930 376 L 972 392 L 972 424 Q 972 456 930 472 Q 888 456 888 424 L 888 392 Z"
        fill="none" stroke="#4ade80" stroke-width="4"/>
  <path d="M 911 421 L 925 435 L 951 407" stroke="#4ade80" stroke-width="5" fill="none" stroke-linecap="round"/>
  <text x="930" y="502" fill="#4ade80" font-family="'Segoe UI',Tahoma,sans-serif" font-size="18" font-weight="800" text-anchor="middle">the build can refuse</text>

  <g font-family="'Segoe UI', Tahoma, sans-serif">
    <text x="80" y="185" fill="#7dd3fc" font-size="24" font-weight="800" letter-spacing="7">ENGINEERING PRACTICE</text>
    <text x="80" y="262" fill="#f8fafc" font-size="56" font-weight="800">How I vibe coded</text>
    <text x="80" y="328" fill="#f8fafc" font-size="56" font-weight="800">this website</text>
    <text x="80" y="396" fill="#e2e8f0" font-size="29" font-weight="600">Prompting was the easy part.</text>
    <text x="80" y="437" fill="#e2e8f0" font-size="29" font-weight="600">The mechanism around it is the job.</text>
    <text x="80" y="540" fill="#94a3b8" font-size="24" font-weight="700">krunalkumar.dpdns.org &#183; Blog</text>
  </g>
</svg>
