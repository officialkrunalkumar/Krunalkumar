<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Cover image: What a VPN does and does not do. Two rows show who can see your traffic. Without a VPN the ISP sees which sites you visit. With a VPN an encrypted tunnel hides that from the ISP and shows it to the VPN provider instead.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121b2c"/>
      <stop offset="1" stop-color="#1f2c3f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <g fill="none" stroke="#38bdf8" stroke-width="3">
    <rect x="700" y="140" width="430" height="360" rx="14" stroke-opacity="0.35"/>
  </g>

  <text x="722" y="186" font-family="'Segoe UI',Tahoma,sans-serif" font-size="16" font-weight="700" fill="#94a3b8" letter-spacing="3">WITHOUT</text>
  <g fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.75">
    <rect x="722" y="214" width="72" height="48" rx="9"/>
    <rect x="880" y="214" width="72" height="48" rx="9"/>
    <rect x="1038" y="214" width="72" height="48" rx="9"/>
  </g>
  <g stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.7">
    <path d="M794 238 L880 238"/>
    <path d="M952 238 L1038 238"/>
  </g>
  <g font-family="'Segoe UI',Tahoma,sans-serif" font-size="18" font-weight="800" fill="#e2e8f0" text-anchor="middle">
    <text x="758" y="245">YOU</text>
    <text x="916" y="245">ISP</text>
    <text x="1074" y="245">SITE</text>
  </g>
  <g fill="none" stroke="#7dd3fc" stroke-width="3">
    <path d="M817 196 Q837 182 857 196 Q837 210 817 196 Z"/>
    <circle cx="837" cy="196" r="4.5" fill="#7dd3fc"/>
  </g>

  <path d="M724 320 L1108 320" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 8" opacity="0.3"/>

  <text x="722" y="368" font-family="'Segoe UI',Tahoma,sans-serif" font-size="16" font-weight="700" fill="#94a3b8" letter-spacing="3">WITH</text>
  <rect x="790" y="380" width="170" height="80" rx="14" fill="none" stroke="#7dd3fc" stroke-width="5" stroke-dasharray="14 10"/>
  <g fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.75">
    <rect x="722" y="396" width="72" height="48" rx="9"/>
    <rect x="880" y="396" width="72" height="48" rx="9"/>
    <rect x="1038" y="396" width="72" height="48" rx="9"/>
  </g>
  <g stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.7">
    <path d="M794 420 L880 420"/>
    <path d="M960 420 L1038 420"/>
  </g>
  <g font-family="'Segoe UI',Tahoma,sans-serif" font-size="18" font-weight="800" fill="#e2e8f0" text-anchor="middle">
    <text x="758" y="427">YOU</text>
    <text x="916" y="427">VPN</text>
    <text x="1074" y="427">SITE</text>
  </g>
  <g fill="none" stroke="#f87171" stroke-width="3" opacity="0.9">
    <path d="M800 352 Q820 338 840 352 Q820 366 800 352 Z"/>
    <path d="M798 366 L842 338" stroke-linecap="round"/>
  </g>
  <g fill="none" stroke="#7dd3fc" stroke-width="3">
    <path d="M896 352 Q916 338 936 352 Q916 366 896 352 Z"/>
