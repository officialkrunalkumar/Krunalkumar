  <g font-family="'Segoe UI', Tahoma, sans-serif">
    <text x="80" y="200" fill="#7dd3fc" font-size="26" font-weight="800" letter-spacing="8">PRIVACY</text>
    <text x="80" y="280" fill="#f8fafc" font-size="52" font-weight="800">What a VPN does</text>
    <text x="80" y="345" fill="#f8fafc" font-size="52" font-weight="800">and does not do</text>
    <text x="80" y="422" fill="#e2e8f0" font-size="26" font-weight="600">It moves trust, it does not remove it</text>
    <text x="80" y="545" fill="#94a3b8" font-size="24" font-weight="700">krunalkumar.dpdns.org &#183; Blog</text>
