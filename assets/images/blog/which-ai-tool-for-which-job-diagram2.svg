<svg width="760" height="300" viewBox="0 0 760 300" role="img" aria-labelledby="d-which-ai-tool-for-which-job-diagram2" xmlns="http://www.w3.org/2000/svg">
  <title id="d-which-ai-tool-for-which-job-diagram2">One assistant handles drafting, summarising, questions, ad-hoc analysis and code snippets; specialists are needed for final-form slides and brand design, video, voice and avatars, meeting capture, multi-file code changes, and anything that must repeat reliably</title>
                  <rect width="760" height="300" rx="18" fill="#1b2735"/>
