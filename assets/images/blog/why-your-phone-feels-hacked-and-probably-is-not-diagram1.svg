<svg width="1160" height="620" viewBox="0 0 1160 620" role="img" aria-labelledby="d-why-your-phone-feels-hacked-and-probably-is-not-diagram1" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <title id="d-why-your-phone-feels-hacked-and-probably-is-not-diagram1">What granting an Android accessibility service actually hands over: one toggle buried in Settings gives an app the ability to read every word on screen, see each keystroke, draw over other apps and tap as the user, which is exactly the chain a banking overlay uses to read a one-time code, cover the real app with a fake screen, approve a transfer and clear the alert</title>
  <text x="40" y="52" fill="#1e77a4" font-size="20" font-weight="800" letter-spacing="3">ONE ACCESSIBILITY TOGGLE &#8212; AND WHAT IT ACTUALLY HANDS OVER</text>

  <!-- 1. The grant -->
  <g>
    <rect x="40" y="90" width="300" height="440" rx="14" fill="none" stroke="#1e77a4" stroke-width="1.5"/>
    <text x="62" y="128" fill="#6b7a90" font-size="21" font-weight="800">The grant</text>
    <text x="62" y="153" fill="#64748b" font-size="15">one tap, buried in Settings</text>

    <rect x="62" y="184" width="256" height="66" rx="10" fill="none" stroke="#1e77a4" stroke-width="1.5"/>
    <rect x="78" y="200" width="34" height="34" rx="9" fill="#1e77a4" opacity="0.22"/>
    <rect x="78" y="200" width="34" height="34" rx="9" fill="none" stroke="#1e77a4" stroke-width="1.5"/>
    <text x="122" y="213" fill="#6b7a90" font-size="15">Battery Saver Pro</text>
    <text x="122" y="234" fill="#64748b" font-size="13">Use this service</text>
    <rect x="266" y="207" width="38" height="22" rx="11" fill="#1e77a4"/>
    <circle cx="293" cy="218" r="8" fill="#f8fafc"/>

    <text x="62" y="276" fill="#64748b" font-size="14">Settings &#8594; Accessibility</text>
    <text x="62" y="296" fill="#64748b" font-size="14">&#8594; Installed apps</text>

    <rect x="62" y="316" width="256" height="118" rx="10" fill="none" stroke="#93671a" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="78" y="342" fill="#93671a" font-size="13" font-weight="700">THE WARNING NOBODY READS</text>
    <text x="78" y="368" fill="#64748b" font-size="13">Needs full control of your device</text>
    <text x="78" y="390" fill="#64748b" font-size="13">It can view and control the screen</text>
    <text x="78" y="412" fill="#64748b" font-size="13">It can view and perform actions</text>

    <text x="62" y="462" fill="#64748b" font-size="15">Tapped through once, in a hurry,</text>
    <text x="62" y="484" fill="#64748b" font-size="15">to make a free app stop nagging.</text>
    <text x="62" y="506" fill="#64748b" font-size="15">Then never looked at again.</text>
  </g>

  <g stroke="#6b7a90" stroke-width="2.5" stroke-linecap="round" fill="none">
    <line x1="342" y1="300" x2="358" y2="300"/>
    <path d="M352 294 L360 300 L352 306"/>
  </g>

  <!-- 2. What it grants -->
  <g>
    <rect x="368" y="90" width="376" height="440" rx="14" fill="none" stroke="#93671a" stroke-width="1.5"/>
    <text x="390" y="128" fill="#6b7a90" font-size="21" font-weight="800">What the app can now do</text>
    <text x="390" y="153" fill="#64748b" font-size="15">in every other app on the phone</text>

    <rect x="390" y="176" width="332" height="60" rx="10" fill="none" stroke="#93671a" stroke-width="1.5"/>
    <text x="408" y="202" fill="#6b7a90" font-size="16">Read every word on screen</text>
    <text x="408" y="223" fill="#64748b" font-size="13">including other apps' text fields</text>

    <rect x="390" y="248" width="332" height="60" rx="10" fill="none" stroke="#93671a" stroke-width="1.5"/>
    <text x="408" y="274" fill="#6b7a90" font-size="16">See each keystroke as you type</text>
    <text x="408" y="295" fill="#64748b" font-size="13">the keylogger comes free with it</text>

    <rect x="390" y="320" width="332" height="60" rx="10" fill="none" stroke="#93671a" stroke-width="1.5"/>
    <text x="408" y="346" fill="#6b7a90" font-size="16">Draw on top of other apps</text>
    <text x="408" y="367" fill="#64748b" font-size="13">a fake screen over a real one</text>

    <rect x="390" y="392" width="332" height="60" rx="10" fill="none" stroke="#93671a" stroke-width="1.5"/>
    <text x="408" y="418" fill="#6b7a90" font-size="16">Tap, swipe and scroll as you</text>
    <text x="408" y="439" fill="#64748b" font-size="13">no second confirmation anywhere</text>

    <text x="390" y="484" fill="#64748b" font-size="15">None of this is a bug or an exploit. It</text>
    <text x="390" y="506" fill="#64748b" font-size="15">is what a screen reader genuinely needs.</text>
  </g>

  <g stroke="#6b7a90" stroke-width="2.5" stroke-linecap="round" fill="none">
    <line x1="746" y1="300" x2="762" y2="300"/>
    <path d="M756 294 L764 300 L756 306"/>
  </g>

  <!-- 3. The chain -->
  <g>
    <rect x="772" y="90" width="348" height="440" rx="14" fill="none" stroke="#8f49df" stroke-width="1.5"/>
    <text x="794" y="128" fill="#6b7a90" font-size="21" font-weight="800">How that becomes theft</text>
    <text x="794" y="153" fill="#64748b" font-size="15">roughly four seconds, start to finish</text>

    <line x1="812" y1="196" x2="812" y2="424" stroke="#8f49df" stroke-width="1.5" stroke-dasharray="5 6"/>

    <circle cx="812" cy="196" r="13" fill="none" stroke="#8f49df" stroke-width="2"/>
    <text x="812" y="201" fill="#8f49df" font-size="13" font-weight="700" text-anchor="middle">1</text>
    <text x="840" y="192" fill="#6b7a90" font-size="16">Reads the one-time code</text>
    <text x="840" y="213" fill="#64748b" font-size="13">straight off the notification</text>

    <circle cx="812" cy="272" r="13" fill="none" stroke="#8f49df" stroke-width="2"/>
    <text x="812" y="277" fill="#8f49df" font-size="13" font-weight="700" text-anchor="middle">2</text>
    <text x="840" y="268" fill="#6b7a90" font-size="16">Overlays a fake screen</text>
    <text x="840" y="289" fill="#64748b" font-size="13">you are shown a loading spinner</text>

    <circle cx="812" cy="348" r="13" fill="none" stroke="#8f49df" stroke-width="2"/>
    <text x="812" y="353" fill="#8f49df" font-size="13" font-weight="700" text-anchor="middle">3</text>
    <text x="840" y="344" fill="#6b7a90" font-size="16">Approves the transfer</text>
    <text x="840" y="365" fill="#64748b" font-size="13">tapping behind the spinner</text>

    <circle cx="812" cy="424" r="13" fill="none" stroke="#8f49df" stroke-width="2"/>
    <text x="812" y="429" fill="#8f49df" font-size="13" font-weight="700" text-anchor="middle">4</text>
    <text x="840" y="420" fill="#6b7a90" font-size="16">Clears the alert</text>
    <text x="840" y="441" fill="#64748b" font-size="13">so nothing on screen looks wrong</text>

    <rect x="794" y="464" width="304" height="48" rx="10" fill="none" stroke="#d42b25" stroke-width="1.5"/>
    <text x="810" y="486" fill="#d42b25" font-size="14">No root. No exploit. No signature.</text>
    <text x="810" y="505" fill="#d42b25" font-size="14">One permission, granted by hand.</text>
  </g>

  <text x="40" y="576" fill="#64748b" font-size="15">Go and read your own list: Settings, Accessibility, Installed apps. A torch, a game or a battery cleaner has no business being on it.</text>
</svg>
