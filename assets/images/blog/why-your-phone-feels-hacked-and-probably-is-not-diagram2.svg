<svg width="1160" height="620" viewBox="0 0 1160 620" role="img" aria-labelledby="d-why-your-phone-feels-hacked-and-probably-is-not-diagram2" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <title id="d-why-your-phone-feels-hacked-and-probably-is-not-diagram2">Why an advert can follow a spoken conversation without a microphone: an ad network already links two devices through a shared home address, a shared account, an uploaded contact list, overlapping locations and bought lookalike audiences, so a search made on one device selects the advert shown on the other; and the reason it feels uncanny is that thousands of adverts are scrolled past unnoticed each week while only the handful that echo a recent conversation are remembered</title>
  <text x="40" y="52" fill="#1e77a4" font-size="20" font-weight="800" letter-spacing="3">HOW THE ADVERT ARRIVES WITHOUT THE MICROPHONE</text>

  <!-- 1. What already links you -->
  <g>
    <rect x="40" y="90" width="352" height="440" rx="14" fill="none" stroke="#1e77a4" stroke-width="1.5"/>
    <text x="62" y="128" fill="#6b7a90" font-size="21" font-weight="800">What already links you</text>
    <text x="62" y="153" fill="#64748b" font-size="15">signals the ad network holds anyway</text>

    <rect x="62" y="182" width="10" height="10" rx="2" fill="#1e77a4"/>
    <text x="86" y="192" fill="#6b7a90" font-size="16">One home address</text>
    <text x="86" y="213" fill="#64748b" font-size="13">one public address for the whole flat</text>

    <rect x="62" y="246" width="10" height="10" rx="2" fill="#1e77a4"/>
    <text x="86" y="256" fill="#6b7a90" font-size="16">One signed-in account</text>
    <text x="86" y="277" fill="#64748b" font-size="13">the laptop and the phone are one person</text>

    <rect x="62" y="310" width="10" height="10" rx="2" fill="#1e77a4"/>
    <text x="86" y="320" fill="#6b7a90" font-size="16">An uploaded contact list</text>
    <text x="86" y="341" fill="#64748b" font-size="13">an app one of you let read the contacts</text>

    <rect x="62" y="374" width="10" height="10" rx="2" fill="#1e77a4"/>
    <text x="86" y="384" fill="#6b7a90" font-size="16">Overlapping locations</text>
    <text x="86" y="405" fill="#64748b" font-size="13">two phones in one place, every evening</text>

    <rect x="62" y="438" width="10" height="10" rx="2" fill="#1e77a4"/>
    <text x="86" y="448" fill="#6b7a90" font-size="16">A bought lookalike audience</text>
    <text x="86" y="469" fill="#64748b" font-size="13">people who resemble you, sold in bulk</text>

    <text x="62" y="510" fill="#64748b" font-size="15">None of it needs a word said aloud.</text>
  </g>

  <!-- 2. The join -->
  <g>
    <rect x="414" y="90" width="300" height="440" rx="14" fill="none" stroke="#93671a" stroke-width="1.5"/>
    <text x="436" y="128" fill="#6b7a90" font-size="20" font-weight="800">What actually happens</text>
    <text x="436" y="153" fill="#64748b" font-size="15">two days, two devices</text>

    <rect x="452" y="188" width="66" height="46" rx="6" fill="none" stroke="#93671a" stroke-width="1.5"/>
    <line x1="466" y1="234" x2="504" y2="234" stroke="#93671a" stroke-width="1.5"/>
    <text x="485" y="256" fill="#64748b" font-size="13" text-anchor="middle">his laptop</text>

    <rect x="612" y="186" width="32" height="52" rx="6" fill="none" stroke="#93671a" stroke-width="1.5"/>
    <line x1="620" y1="230" x2="636" y2="230" stroke="#93671a" stroke-width="1.2"/>
    <text x="628" y="256" fill="#64748b" font-size="13" text-anchor="middle">your phone</text>

    <path d="M485 274 L556 306" fill="none" stroke="#93671a" stroke-width="2" stroke-linecap="round"/>
    <path d="M628 274 L557 306" fill="none" stroke="#93671a" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 5"/>
    <circle cx="556" cy="322" r="22" fill="none" stroke="#93671a" stroke-width="2"/>
    <circle cx="556" cy="322" r="7" fill="#93671a" opacity="0.5"/>
    <text x="556" y="366" fill="#6b7a90" font-size="15" text-anchor="middle">one profile</text>

    <path d="M556 380 v26" fill="none" stroke="#93671a" stroke-width="2" stroke-linecap="round"/>
    <path d="M550 400 L556 408 L562 400" fill="none" stroke="#93671a" stroke-width="2" stroke-linecap="round"/>

    <text x="436" y="436" fill="#64748b" font-size="14">Tuesday: he searches treadmills.</text>
    <text x="436" y="459" fill="#64748b" font-size="14">Wednesday: you mention it aloud.</text>
    <text x="436" y="482" fill="#64748b" font-size="14">Thursday: your phone shows the ad.</text>
    <text x="436" y="510" fill="#6b7a90" font-size="15">The order is what fools you.</text>
  </g>

  <!-- 3. Why you remember it -->
  <g>
    <rect x="736" y="90" width="384" height="440" rx="14" fill="none" stroke="#8f49df" stroke-width="1.5"/>
    <text x="758" y="128" fill="#6b7a90" font-size="21" font-weight="800">Why this one stuck</text>
    <text x="758" y="153" fill="#64748b" font-size="15">a week of adverts, drawn to scale</text>

    <text x="758" y="196" fill="#6b7a90" font-size="15">Adverts you scrolled past</text>
    <rect x="758" y="208" width="340" height="34" rx="6" fill="#8f49df" opacity="0.22"/>
    <rect x="758" y="208" width="340" height="34" rx="6" fill="none" stroke="#8f49df" stroke-width="1.5"/>
    <text x="770" y="231" fill="#6b7a90" font-size="14">thousands</text>

    <text x="758" y="286" fill="#6b7a90" font-size="15">Ones that echoed something you said</text>
    <rect x="758" y="298" width="46" height="34" rx="6" fill="#8f49df" opacity="0.45"/>
    <rect x="758" y="298" width="46" height="34" rx="6" fill="none" stroke="#8f49df" stroke-width="1.5"/>
    <text x="816" y="321" fill="#64748b" font-size="14">a handful, by chance alone</text>

    <text x="758" y="376" fill="#6b7a90" font-size="15">Ones you noticed and still recall</text>
    <rect x="758" y="388" width="9" height="34" rx="4" fill="#8f49df"/>
    <text x="779" y="411" fill="#64748b" font-size="14">this one</text>

    <line x1="758" y1="446" x2="1098" y2="446" stroke="#8f49df" stroke-width="1" stroke-dasharray="4 5"/>
    <text x="758" y="474" fill="#64748b" font-size="14">A wrong advert is never a memory, so the</text>
    <text x="758" y="496" fill="#64748b" font-size="14">misses are never counted against the hits.</text>
    <text x="758" y="518" fill="#64748b" font-size="14">Nothing here requires the microphone.</text>
  </g>

  <text x="40" y="576" fill="#64748b" font-size="15">The honest exception: some apps listen for inaudible beacons in TV adverts. Real and documented &#8212; and still not a transcript.</text>
</svg>
