<!--
  Shared site header — the single source of truth for the navigation.
  Loaded into every page at runtime by assets/js/include-partials.js.
  Just edit this file and refresh; the current page's nav link gets
  class="active" and aria-current="page" automatically.
-->
<header class="site-header">
  <nav class="nav" id="navbar" aria-label="Main">
    <a class="brand" href="/">Krunalkumar Shah</a>
    <button class="nav-toggle" type="button" aria-label="Open navigation menu" aria-expanded="false" aria-controls="nav-menu">
      <span class="nav-toggle-bar"></span>
      <span class="nav-toggle-bar"></span>
      <span class="nav-toggle-bar"></span>
    </button>
    <div class="nav-list" id="nav-menu">
      <a class="nav-link" href="/">Home</a>
      <a class="nav-link" href="/about">About</a>
      <a class="nav-link" href="/services">Services</a>
      <a class="nav-link" href="/projects">Projects</a>
      <a class="nav-link" href="/labs">Labs</a>
      <a class="nav-link" href="/research">Research</a>
      <a class="nav-link" href="/blog">Blog</a>
      <a class="nav-link" href="/client-reviews">Recommendations</a>
      <a class="nav-link" href="/internships">Internships</a>
      <a class="nav-link" href="/contact">Contact</a>
      <div class="nav-dropdown" hidden>
        <!-- Disclosure pattern, not a menu widget — aria-expanded alone is correct;
             aria-haspopup would promise role="menu" semantics this plain link list
             doesn't have. -->
        <button class="nav-dropdown-toggle" type="button" aria-expanded="false">
          More
          <span class="nav-caret" aria-hidden="true">▾</span>
        </button>
        <div class="nav-dropdown-menu"></div>
      </div>
    </div>
          <div class="nav-tools">
            <button class="theme-toggle" id="theme-toggle" type="button"
                    aria-label="Switch theme" title="Switch theme">
              <svg class="theme-moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" fill="currentColor"/>
              </svg>
              <svg class="theme-sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <circle cx="12" cy="12" r="4.2" fill="currentColor"/>
                <path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"
                      stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>
              </svg>
            </button>
            <button class="search-open" id="search-open" type="button"
                    aria-label="Search the site" title="Search  /">
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/>
                <path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              </svg>
            </button>
          </div>
  </nav>
</header>
