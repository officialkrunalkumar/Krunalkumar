    <!-- 🫖 Hidden easter egg #3: HTTP 418, as a tea party. Unlisted everywhere
         except the terminal's `teapot` command. noindex, not in the sitemap.
         The teapot pours only when tapped — tea is shared on request. -->
    <meta name="robots" content="noindex,nofollow" />
    <meta name="description" content="418 — I'm a teapot. The hidden tea party." />

    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html { color-scheme: dark; }
      body {
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.55rem;
        padding: 0.9rem 1.25rem 1.1rem;
        background: linear-gradient(160deg, #16203a 0%, #121b2c 55%, #0e1626 100%);
        color: #e2f0ff;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        text-align: center;
      }
      .code { color: #fbbf24; font-size: 0.85rem; font-weight: 700; letter-spacing: 0.3em; }
      h1 { color: #f8fafc; font-size: clamp(1.3rem, 4vw, 1.9rem); }
      .sub { color: #94a3b8; max-width: 36rem; line-height: 1.5; font-size: 0.95rem; }
      /* The whole party must fit without scrolling: cap the scene by the
         viewport height left over after the text rows (~230px), converted
         to width via the 900:560 aspect ratio. */
      .scene { width: min(780px, 100%, calc((100svh - 230px) * 1.6)); }
      .scene svg { width: 100%; height: auto; display: block; }
      a.home { color: #7dd3fc; text-decoration: underline; text-underline-offset: 3px; }
      .small { color: #64748b; font-size: 0.85rem; }
      .hint { color: #fbbf24; font-size: 0.95rem; animation: hint-pulse 2s ease-in-out infinite; }
      .hint.gone { display: none; }
      @keyframes hint-pulse { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }

      /* Interactive semantics (role/tabindex/label/cursor) are granted by
         teapot.js at wire-up, so without JS there is no dead button and no
         pointer cursor — just a picture. Same for the tap hint below. */
      html.js #teapot { cursor: pointer; outline: none; }
      html:not(.js) .hint { display: none; }
      #teapot:focus-visible ellipse.pot-body { stroke: #7dd3fc; stroke-width: 3; }

      /* --- idle life --- */
      .twinkle { animation: twinkle 3.2s ease-in-out infinite; }
      .twinkle-b { animation: twinkle 4.1s ease-in-out infinite 1.4s; }
      @keyframes twinkle { 0%, 100% { opacity: 0.25; } 50% { opacity: 0.8; } }
      .bulb-glow { animation: bulb 3.6s ease-in-out infinite; }
      .bulb-glow-b { animation: bulb 4.4s ease-in-out infinite 1.8s; }
      @keyframes bulb { 0%, 100% { opacity: 0.5; } 50% { opacity: 0.9; } }

      .bob-a { animation: bob 2.8s ease-in-out infinite; }
      .bob-b { animation: bob 3.3s ease-in-out infinite 0.5s; }
      .bob-c { animation: bob 2.4s ease-in-out infinite 1s; }
      .breathe { animation: breathe 3.4s ease-in-out infinite; transform-origin: 450px 352px; }
      @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
      @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.015); } }

      .blink { animation: blink 4.2s infinite; transform-origin: center; transform-box: fill-box; }
      .blink-b { animation: blink 5.1s infinite 1.6s; transform-origin: center; transform-box: fill-box; }
      @keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 95.5% { transform: scaleY(0.08); } }

      .steam { animation: steam 3.6s ease-in-out infinite; }
      .steam-b { animation: steam 4.2s ease-in-out infinite 1.3s; }
      @keyframes steam {
        0% { opacity: 0; transform: translateY(5px); }
        35% { opacity: 0.65; }
        100% { opacity: 0; transform: translateY(-24px); }
      }
      .lid-hop { animation: lid-hop 6s ease-in-out infinite; }
      @keyframes lid-hop {
        0%, 88%, 100% { transform: translateY(0); }
        92% { transform: translateY(-7px); }
        96% { transform: translateY(0); }
      }

      /* --- the tap-to-pour performance (single run per tap) --- */
      .pour-parts { visibility: hidden; }
      .pouring .pour-parts { visibility: visible; }

      .pouring .teapot-main { animation: pour-tilt 1.9s ease-in-out 1; transform-origin: 450px 352px; }
      @keyframes pour-tilt {
        0%, 100% { transform: rotate(0deg); }
        22%, 72% { transform: rotate(10deg); }
      }
      .pouring .stream { animation: stream 1.9s ease-in-out 1; transform-origin: 551px 330px; }
      @keyframes stream {
        0%, 20%, 82%, 100% { opacity: 0; transform: scaleY(0); }
        30%, 70% { opacity: 0.95; transform: scaleY(1); }
      }
      .pouring .splash { animation: splash 1.9s ease-out 1; transform-origin: 549px 396px; }
      @keyframes splash {
        0%, 30% { opacity: 0; transform: scale(0.3); }
        45%, 62% { opacity: 0.9; transform: scale(1); }
        80%, 100% { opacity: 0; transform: scale(1.25); }
      }
      .pouring .pour-steam { animation: poursteam 1.9s ease-out 1; }
      @keyframes poursteam {
        0%, 55% { opacity: 0; transform: translateY(4px); }
        75% { opacity: 0.8; }
        100% { opacity: 0; transform: translateY(-22px); }
      }
      .pouring .heart-pop { animation: heartpop 1.9s ease-out 1; transform-origin: 450px 240px; }
      @keyframes heartpop {
        0%, 60% { opacity: 0; transform: translateY(6px) scale(0.5); }
        75% { opacity: 1; transform: translateY(-10px) scale(1.1); }
        100% { opacity: 0; transform: translateY(-30px) scale(1); }
      }
      /* friends celebrate when the tea lands */
      .pouring .cheer-a { animation: cheer 1.9s ease-in-out 1; transform-origin: 200px 380px; }
      .pouring .cheer-b { animation: cheer 1.9s ease-in-out 1 0.12s; transform-origin: 696px 380px; }
      .pouring .cheer-c { animation: peek-hop 1.9s ease-in-out 1; }
      @keyframes cheer {
        0%, 55%, 100% { transform: translateY(0) rotate(0deg); }
        70% { transform: translateY(-9px) rotate(-3deg); }
        85% { transform: translateY(0) rotate(2deg); }
      }
      @keyframes peek-hop {
        0%, 55%, 100% { transform: translateY(0); }
        70%, 85% { transform: translateY(-12px); }
      }
      /* the pot's eyes close into happy arcs while it pours */
      .eyes-happy { opacity: 0; }
      .pouring .eyes-open { opacity: 0; }
      .pouring .eyes-happy { opacity: 1; }

      @media (prefers-reduced-motion: reduce) {
        .twinkle, .twinkle-b, .bulb-glow, .bulb-glow-b, .bob-a, .bob-b, .bob-c,
        .breathe, .blink, .blink-b, .steam, .steam-b, .lid-hop,
        .pouring .teapot-main, .pouring .stream, .pouring .splash,
        .pouring .pour-steam, .pouring .heart-pop,
        .pouring .cheer-a, .pouring .cheer-b, .pouring .cheer-c {
          animation: none;
        }
        /* Tapping still answers: the stream simply shows briefly via JS class,
           with no motion. */
        .pouring .stream { opacity: 0.9; transform: none; }
        .hint { animation: none; }
      }
    </style>
  </head>
