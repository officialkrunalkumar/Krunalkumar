<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#020617" />
    <title>visitor@krunalkumar: ~</title>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/assets/images/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <script src="/assets/js/boot.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html { color-scheme: dark; }
      /* This page never loads main.css, so the screen-reader-only helper the
         rest of the site gets from there has to live here too. */
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      body {
        min-height: 100vh;
        background: #020617;
        color: #86efac;
        font-family: 'Cascadia Code', 'Fira Code', Consolas, Menlo, monospace;
        font-size: 0.92rem;
        line-height: 1.55;
        padding: 1.25rem 1.25rem 40vh;
        cursor: text;
      }
      /* Subtle CRT scanlines */
      body::after {
        content: '';
        position: fixed;
        inset: 0;
        pointer-events: none;
        background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.14) 0 1px, transparent 1px 3px);
      }
      #screen { max-width: 900px; margin: 0 auto; word-break: break-word; }
      .line { white-space: pre-wrap; }
      .dim { color: #5d907f; } /* dimmest shade that still clears WCAG AA on the #020617 background */
      .cyan { color: #7dd3fc; }
      .white { color: #e2e8f0; }
      .warn { color: #fbbf24; }
      .alert { color: #f87171; font-weight: 700; }
      .ok { color: #4ade80; font-weight: 700; }
      a { color: #7dd3fc; text-underline-offset: 3px; }
      .prompt-row { display: flex; flex-wrap: wrap; align-items: baseline; }
      .ps1 { color: #7dd3fc; white-space: nowrap; margin-right: 0.5ch; }
      #cmd {
        flex: 1;
        min-width: 10ch;
        background: transparent;
        border: none;
        outline: none;
        color: #86efac;
        font: inherit;
        caret-color: #86efac;
      }
      .shake { animation: shake 0.35s linear infinite; }
      @keyframes shake {
        0%, 100% { transform: translate(0, 0); }
        25% { transform: translate(-2px, 1px); }
        50% { transform: translate(2px, -1px); }
        75% { transform: translate(-1px, -2px); }
      }
      @media (prefers-reduced-motion: reduce) {
        .shake { animation: none; }
      }
    </style>
  </head>
  <body>
    <noscript>
      <p>This terminal needs JavaScript. Without it there is nothing here&hellip; or is there?</p>
      <p><a href="/">&larr; back to the visible part of the site</a></p>
    </noscript>

    <div id="screen">
      <!-- The page deliberately has no visible chrome, but a screen reader
           still needs one heading to orient by. Visually hidden, not
           display:none — display:none would hide it from AT too. -->
      <h1 class="sr-only">Terminal</h1>
      <div id="output" role="log" aria-live="polite"></div>
      <div class="prompt-row">
        <span class="ps1" id="ps1">visitor@krunalkumar:~$</span>
        <input id="cmd" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" autofocus aria-label="terminal command input" />
      </div>
    </div>

    <script defer src="/assets/js/terminal.js"></script>
  </body>
</html>
